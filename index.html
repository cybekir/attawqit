(function(){var B=40,H=(185+B*47)%360;
function hx(h,s,l){s/=100;l/=100;var a=s*Math.min(l,1-l);function f(n){var k=(n+h/30)%12,c=l-a*Math.max(-1,Math.min(k-3,9-k,1));return Math.round(255*c).toString(16).padStart(2,'0')}return '#'+f(0)+f(8)+f(4)}
function ap(h,sa){sa=sa==null?75:sa;var c=[hx(h,sa,12),hx(h,sa*.87,22),hx(h,sa*.93,36),hx(h,sa*.77,49)],r=document.documentElement.style;
r.setProperty('--c1',c[0]);r.setProperty('--c2',c[1]);r.setProperty('--c3',c[2]);r.setProperty('--c4',c[3]);r.setProperty('--c1a',c[0]+'cc');
var m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',c[0])}
window.applyHue=ap;ap(H,75);window.BUILD=B;window.HUE=H;

d.style.cssText='position:fixed;left:8px;bottom:6px;z-index:99999;font:11px/1 sans-serif;color:#fff;background:#00000066;padding:4px 7px;border-radius:9px;pointer-events:none;opacity:.8';document.body.appendChild(d)})})();

<title>Attawqit</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
<style>:root{--c1:#062f3a;--c2:#0b5a63;--c3:#14a5a3;--c4:#2ec4b6;--c1a:#062f3acc}

:root{--bg:var(--c1);--card:rgba(255,255,255,.14);--ink:#fff;--mute:#bfeeea;--gold:#ffe7b3}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:480px;margin:0 auto;padding:20px}
h1{font-size:1.4rem;margin:0 0 4px}
.mute{color:var(--mute);font-size:.9rem}
.next{margin:20px 0;padding:22px;background:var(--card);border-left:6px solid var(--gold)}
.next b{display:block;font-size:2.2rem}
.row{display:flex;justify-content:space-between;padding:14px 4px;border-bottom:1px solid #ffffff22;font-size:1.2rem}
.row.on{color:var(--gold);font-weight:bold}
.note{margin-top:18px;padding:12px;background:#ffffff12}
nav{margin-top:26px;display:flex;gap:16px}
a{color:var(--gold)}
label{display:block;margin:14px 0 4px;color:var(--mute)}
input,textarea{width:100%;padding:10px;font:inherit;background:#ffffff14;color:var(--ink);border:1px solid #ffffff33}
button{margin-top:18px;padding:12px 20px;font:inherit;background:var(--gold);border:0;color:#2a2200;font-weight:bold}
/* Affichage TV */
.tv{width:100%;height:100vh;height:100dvh;padding:2vh 3vw;display:grid;grid-template-rows:auto auto auto minmax(0,1fr) auto;gap:1.5vh;text-align:center;overflow:hidden;background:linear-gradient(165deg,var(--c1) 0%,var(--c2) 45%,var(--c3) 100%);color:#fff;font-family:'Cormorant Garamond',Georgia,serif;font-weight:600}
.tv h1{font-size:min(3.8vw,7vh);color:var(--gold);margin:0;overflow-wrap:anywhere}
.tv .top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2.4fr) minmax(0,1fr);gap:1.5vw;align-items:center}
.tv .side span{font-size:min(2.4vw,4vh)}.tv .side b{display:block;font-size:min(4.6vw,9vh)}
.tv .clock{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(6px);border-radius:2vw;padding:1.5vh 1vw}
.tv .clock b{display:block;font-size:min(8.5vw,16vh);line-height:1}.tv .clock span{font-size:min(2.6vw,4.5vh)}
.tv .cd{font-size:min(3vw,5.5vh);font-weight:bold}
.tv .grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1vw;align-items:center}
.tv .cell{padding:1.5vh 0;border-radius:1.5vw}
.tv .cell.on{background:linear-gradient(160deg,rgba(255,255,255,.4),rgba(255,255,255,.14));box-shadow:0 0 0 .25vw #ffffffaa}
.tv .cell span{display:block;font-size:min(2.8vw,5vh)}.tv .cell b{display:block;font-size:min(5.6vw,11vh)}.tv .cell i{display:block;font-style:normal;font-size:min(4vw,8vh)}
.tv footer{display:flex;justify-content:space-between;align-items:end;gap:2vw;font-size:min(2vw,3.6vh)}
.tv .brand{color:var(--gold);font-weight:bold}
.ph{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2vh;padding:4vh 6vw}
.ph h2{font-size:min(5.5vw,9vh);margin:0;color:var(--gold)}.ph .big{font-size:min(14vw,28vh);font-weight:bold;line-height:1}
.ph p{font-size:3.4vw;margin:0;max-width:85vw}.ph .ar{font-size:4.4vw;direction:rtl;line-height:1.7}

/* Application mobile (turquoise) */
body.app{background:linear-gradient(165deg,var(--c1) 0%,var(--c2) 45%,var(--c3) 100%) fixed;min-height:100vh;color:#fff;font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-variant-numeric:lining-nums}
.mob{max-width:480px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px 110px}

.cd2{text-align:center}.cd2 small{font-size:1.15rem}.cd2 b{display:block;font-size:2.8rem;margin:4px 0 16px}
.bar{height:10px;border-radius:5px;background:linear-gradient(90deg,#fff3c4,#ffd9c0);position:relative;margin:0 14px 18px}.bar i{position:absolute;top:-9px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 0 18px #fff9;transform:translateX(-50%)}
.pills{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pill{border-radius:20px;padding:12px 8px;text-align:center;background:rgba(0,0,0,.18);font-size:1.05rem}.pill.w{background:#f1fbfa;color:#0b4a52}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.pc{background:rgba(255,255,255,.12);border-radius:24px;padding:14px 16px}
.pc>span{font-size:1.2rem;font-variant:small-caps;letter-spacing:.04em}.pc b{display:block;font-size:2.7rem;font-weight:500;margin:2px 0 8px}
.iq{display:flex;justify-content:space-between;font-size:1rem;opacity:.85;font-variant:small-caps}
.pc.next{background:linear-gradient(160deg,rgba(255,255,255,.36),rgba(255,255,255,.14));box-shadow:0 0 0 2px #ffffffaa}
.tabs{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:456px;margin:0 auto;display:flex;background:rgba(6,47,58,.88);border-radius:28px;padding:8px}
.tabs a{flex:1;text-align:center;color:#bfeeea;text-decoration:none;padding:8px 0;border-radius:20px;font-size:.9rem}.tabs a i{display:block;font-style:normal;font-size:1.3rem}.tabs a.on{background:rgba(255,255,255,.2);color:#fff}
.mob button{margin-top:10px;padding:12px 20px;border:0;border-radius:20px;background:#fff;color:#0b4a52;font:inherit;font-weight:700}
.mob a{color:#fff}.mob p{margin:8px 0}
.opt{background:#ffffff1f;border:1px solid #ffffff33;color:#fff;border-radius:14px;padding:11px 14px;font:inherit;margin:4px 6px 0 0;cursor:pointer}.opt.on{background:#ffffff40;border-color:#fff}
.glass select,.glass input[type=text],#wq,#wk,select.opt{width:100%;min-height:52px;padding:14px 16px;border-radius:16px;background:#ffffff1f;color:#fff;border:1px solid #ffffff33;font:inherit;font-size:1.05rem;margin:6px 0;-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,#fff 50%),linear-gradient(135deg,#fff 50%,transparent 50%);background-position:calc(100% - 22px) 52%,calc(100% - 16px) 52%;background-size:6px 6px,6px 6px;background-repeat:no-repeat}.glass select option{color:#000;font-size:1rem}
.glass p{margin:8px 0}.tabs a{padding:8px 2px;font-size:.74rem;min-width:0}.tabs a i{font-style:normal}
[dir=rtl] .pc b,[dir=rtl] .cd2 b,[dir=rtl] .rnd{direction:ltr;unicode-bidi:isolate}
[dir=rtl] .tv b,[dir=rtl] .tv i,[dir=rtl] .big{direction:ltr;unicode-bidi:isolate}
.tv .cell{background:rgba(0,0,0,.16)}
.tv .brand,.tv h1,.ph h2{color:#ffe7b3}
.tv .clock span,.tv .side span{color:#d9f6f3}
button{background:#fff;color:#0b4a52;border-radius:20px}
.sw{display:inline-block;width:52px;height:30px;border-radius:15px;background:#ffffff26;position:relative;cursor:pointer;justify-self:center}.sw:after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#8b90a0;transition:.2s}.sw.on{background:#fff}.sw.on:after{left:25px;background:#14141c}
.nrow{display:grid;grid-template-columns:1fr 64px 64px;align-items:center;gap:6px;margin:10px 0}
body.app{background:radial-gradient(130% 70% at 50% -10%,var(--c2) 0%,var(--c1) 60%,#04030a 100%) fixed;min-height:100vh;color:#f4f2fb;font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans Arabic',sans-serif;font-weight:500}
.mob{max-width:520px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px 130px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px}.cdn{font-size:1.9rem;line-height:1.15;font-weight:500}.cdn b{font-weight:800;font-variant-numeric:tabular-nums}
.hb{display:flex;gap:10px}.rb{width:46px;height:46px;border-radius:50%;background:#ffffff14;display:flex;align-items:center;justify-content:center;color:#fff;text-decoration:none;flex:none}
.sv{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sel{display:flex;align-items:center;gap:12px;margin-top:16px;padding:10px 14px;border:1px solid #ffffff2e;border-radius:22px;color:#fff;text-decoration:none}
.av{width:42px;height:42px;border-radius:50%;background:linear-gradient(160deg,var(--c3),var(--c2));display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none}.av img{width:100%;height:100%;object-fit:cover}
.sn{display:flex;flex-direction:column;min-width:0;flex:1}.sn b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:1.05rem}.sn small{opacity:.7}.chev{opacity:.7;font-size:1.3rem}
.dts{display:flex;align-items:center;gap:12px;margin:14px 4px 0;opacity:.9}.dts i{width:1px;height:18px;background:#ffffff66}
.seg{display:flex;gap:6px;margin:18px 0 14px;overflow-x:auto}.seg a{padding:10px 16px;border-radius:16px;color:#fff;text-decoration:none;white-space:nowrap;opacity:.85}.seg a.on{background:linear-gradient(160deg,var(--c3),var(--c2));opacity:1;font-weight:700}
.pg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pc{background:#ffffff0f;border-radius:20px;padding:14px 4px 12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.pc .pn{font-size:1rem;opacity:.9}.pc .pt{font-size:1.65rem;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}.pc .pi{font-size:1.1rem;opacity:.85}
.pc.next{background:linear-gradient(160deg,var(--c3),var(--c2));box-shadow:0 6px 24px #0006}
.bl{width:44px;height:44px;border-radius:50%;border:0;background:#0000003a;color:#fff;display:flex;align-items:center;justify-content:center;margin-top:4px;cursor:pointer}.bl:not(.on){opacity:.55}
.ex{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:10px;margin-top:12px}.ex div{background:#ffffff0f;border-radius:18px;padding:14px 8px;text-align:center}.ex span{display:block;opacity:.85;font-size:.95rem}.ex b{display:block;font-size:1.45rem;margin-top:6px;font-variant-numeric:tabular-nums}

.bn{position:fixed;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));max-width:496px;margin:0 auto;display:flex;align-items:center;gap:10px;z-index:50}
.lg{width:62px;height:62px;border-radius:50%;background:linear-gradient(160deg,var(--c3),var(--c2));display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-decoration:none;box-shadow:0 6px 20px #0008;flex:none;line-height:1.1}.lg b{font-size:.8rem}.lg small{font-size:.45rem;letter-spacing:.08em}

.ttl{font-size:1.6rem;font-weight:700;margin:6px 4px 4px}

/* ===== présentations des horaires ===== */
.pc.past{opacity:.62}
.pg.l-wide{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pg.l-wide .pc{padding:22px 8px 16px;border-radius:28px}.pg.l-wide .pc .pt{font-size:2.35rem}.pg.l-wide .pc .pn{font-size:1.1rem}
.pg.l-list{grid-template-columns:1fr;gap:8px}
.pg.l-list .pc{flex-direction:row;justify-content:space-between;padding:12px 14px 12px 20px;gap:12px;text-align:start;border-radius:22px}
.pg.l-list .pc .pn{flex:1;font-size:1.15rem}.pg.l-list .pc .pt{font-size:1.9rem}.pg.l-list .pc .pi{min-width:56px;text-align:end}.pg.l-list .pc .bl{margin:0}
.pg.l-time{grid-template-columns:1fr;gap:0;position:relative;padding-inline-start:28px}
.pg.l-time::before{content:'';position:absolute;inset-inline-start:10px;top:22px;bottom:22px;width:2px;background:linear-gradient(var(--c4),#ffffff22)}
.pg.l-time .pc{flex-direction:row;background:transparent;box-shadow:none;border-radius:0;padding:14px 0;gap:12px;text-align:start;justify-content:space-between;position:relative;border-bottom:1px solid #ffffff12}
.pg.l-time .pc::before{content:'';position:absolute;inset-inline-start:-24px;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;background:var(--c1);border:2px solid var(--c4)}
.pg.l-time .pc.next{background:linear-gradient(90deg,#ffffff1c,transparent);box-shadow:none}
.pg.l-time .pc.next::before{background:#fff;border-color:#fff;box-shadow:0 0 0 5px #ffffff33}
.pg.l-time .pc.past{opacity:.5}.pg.l-time .pc .pn{flex:1;font-size:1.1rem}.pg.l-time .pc .pt{font-size:1.8rem}.pg.l-time .pc .bl{margin:0;width:38px;height:38px}
.pg.l-min{grid-template-columns:1fr;gap:0}
.pg.l-min .pc{background:transparent!important;box-shadow:none!important;flex-direction:row;align-items:baseline;justify-content:space-between;padding:10px 4px;border-radius:0;border-bottom:1px solid #ffffff14;text-align:start;gap:8px}
.pg.l-min .pc .pn{flex:1;font-size:.9rem;opacity:.65;text-transform:uppercase;letter-spacing:.14em}
.pg.l-min .pc .pt{font-size:2.7rem;font-weight:300;line-height:1}.pg.l-min .pc .pi{width:54px;text-align:end;opacity:.55}.pg.l-min .pc .bl{width:36px;height:36px;margin:0;align-self:center}
.pg.l-min .pc.next .pt{color:var(--c4);font-weight:600}.pg.l-min .pc.next .pn{opacity:1}.pg.l-min .pc.past{opacity:.42}
.pg.l-glass{gap:12px}
.pg.l-glass .pc{background:linear-gradient(160deg,#ffffff2b,#ffffff0a);border:1px solid #ffffff30;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:30px;padding:20px 6px 14px;box-shadow:0 10px 30px #0004}
.pg.l-glass .pc.next{background:linear-gradient(160deg,var(--c4),var(--c3) 55%,var(--c2));border-color:#ffffff99;box-shadow:0 12px 40px #0007}
/* ===== sélection : l'élément choisi est BLANC, les autres restent GRIS ===== */
.opt{background:#ffffff14;border:1px solid #ffffff1f;color:#9a9fb0}
.opt.on{background:#fff;border-color:#fff;color:#14141c;font-weight:700}
.seg a{background:#ffffff0f;color:#9a9fb0;opacity:1}.seg a.on{background:#fff;color:#14141c}
.bi a{color:#8f94a6}.bi a.on{background:#fff;color:#14141c}.bi a.on svg{stroke:#14141c}
.bl{background:#ffffff1a;color:#9a9fb0;opacity:1!important}.bl.on{background:#fff;color:#14141c}
.lay{display:inline-flex;flex-direction:column;align-items:center;gap:6px;width:calc(33.3% - 8px);min-width:88px;margin:4px 4px 0 0;padding:10px 6px;border-radius:16px;border:1px solid #ffffff1f;background:#ffffff14;color:#9a9fb0;font:inherit;font-size:.8rem;cursor:pointer}
.lay.on{background:#fff;border-color:#fff;color:#14141c;font-weight:700}
.mp{display:grid;gap:3px;width:58px;height:42px}.mp b{background:currentColor;opacity:.5;border-radius:4px}.mp b:first-child{opacity:1}
.mp-grid,.mp-glass{grid-template-columns:repeat(3,1fr)}.mp-wide{grid-template-columns:repeat(2,1fr)}.mp-glass b{border-radius:8px}
.mp-list,.mp-time,.mp-min{grid-template-columns:1fr;grid-auto-rows:1fr}.mp-list b:nth-child(n+5),.mp-time b:nth-child(n+5),.mp-min b:nth-child(n+5),.mp-wide b:nth-child(n+5){display:none}
.mp-time{border-inline-start:2px solid currentColor;padding-inline-start:5px}.mp-min b{border-radius:0;height:3px;align-self:center;opacity:.5}.mp-min b:first-child{height:5px}
.pw{width:42px;height:42px;border-radius:50%;border:2px solid #ffffff26;margin:4px 6px 0 0;cursor:pointer;color:#fff;font:inherit;font-size:.7rem;display:inline-flex;align-items:center;justify-content:center;padding:0}
.pw.on{border-color:#fff;box-shadow:0 0 0 3px #ffffff55}
button:disabled,.opt:disabled,.opt[aria-disabled=true],.pill:disabled{background:#ffffff1a!important;color:#8b90a0!important;border-color:#ffffff1f!important;cursor:not-allowed!important;box-shadow:none!important;opacity:.7}
.opt.on,button.on{background:#fff!important;color:#14141c!important;border-color:#fff!important}
.wsel{margin:10px 0}.wsel select{width:100%;min-height:52px;padding:14px 16px;border-radius:16px;font-size:1.05rem}
#wcity{margin:10px 0}
#wgo{width:100%;margin-top:8px}

/* Sélections : non sélectionné = gris, sélectionné = blanc (règle finale, prioritaire) */
.mob button:not(.big):not(.on):not(.pw):not(.sw),button:not(.big):not(.on):not(.pw):not(.sw):not(:disabled),.opt:not(.on),.seg a:not(.on),.lay:not(.on),.ghost:not(.on),.bi a:not(.on){background:#ffffff1f!important;color:#d7dae3!important;border-color:#ffffff33!important}

function matchesCountry(c,cc){if(!cc)return true;const v=String(c||'').trim();if(!v)return true;

async function nearRows(p,cc){

    try{const [a,b]=await Promise.all([
      fetch(`${SB}/mosques?select=slug,name,city,address,lat,lng,country&show_on_map=eq.true&${bb}&limit=500`,H).then(r=>r.json()),
      fetch(`${SB}/mosque_directory?select=osm_id,name,city,address,lat,lng,country&claimed_mosque_id=is.null${cc?'&country=eq.'+encodeURIComponent(cc):''}&${bb}&limit=500`,H).then(r=>r.json())]);
      reg=(Array.isArray(a)?a:[]).filter(m=>matchesCountry(m.country,cc));dir=(Array.isArray(b)?b:[]).filter(m=>matchesCountry(m.country,cc))}catch(e){break}
    if(reg.length+dir.length>=10)break;
  }
  reg.forEach(m=>m.reg=1);dir.forEach(m=>m.reg=0);
  const all=reg.concat(dir.filter(x=>!reg.some(r=>km(r.lat,r.lng,x.lat,x.lng)<.08)));   // pas de doublon avec une mosquée inscrite
  all.forEach(m=>m.d=km(p.lat,p.lng,m.lat,m.lng));all.sort((a,b)=>a.d-b.d);return all.slice(0,40)}

const idb=()=>new Promise((ok,ko)=>{const r=indexedDB.open('attawqit',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)});
const idbSet=async(k,v)=>{const d=await idb();return new Promise((ok,ko)=>{const t=d.transaction('f','readwrite');t.objectStore('f').put(v,k);t.oncomplete=ok;t.onerror=()=>ko(t.error)})};
const idbGet=async k=>{const d=await idb();return new Promise((ok,ko)=>{const q=d.transaction('f').objectStore('f').get(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>ko(q.error)})};
const idbDel=async k=>{const d=await idb();return new Promise((ok,ko)=>{const t=d.transaction('f','readwrite');t.objectStore('f').delete(k);t.oncomplete=ok;t.onerror=()=>ko(t.error)})};
let ADH=null,AC=null;
function unlockAudio(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}}
function beep(){try{unlockAudio();const t=AC.currentTime;[0,.6,1.2].forEach(d=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=880;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(.0001,t+d);g.gain.exponentialRampToValueAtTime(.4,t+d+.05);g.gain.exponentialRampToValueAtTime(.0001,t+d+.5);o.start(t+d);o.stop(t+d+.55)})}catch(e){}}
function stopAdhan(){if(ADH){try{ADH.pause()}catch(e){}ADH=null}try{const b=document.getElementById('stopA');if(b)b.remove()}catch(e){}}
function showStop(){try{if(document.getElementById('stopA'))return;document.body.insertAdjacentHTML('beforeend',`<button id="stopA" class="opt on" style="position:fixed;top:14px;inset-inline-end:14px;z-index:9">${tx('stopSound')}</button>`);document.getElementById('stopA').onclick=stopAdhan}catch(e){}}
async function playAdhan(maxSec){stopAdhan();
  if(PR.snd==='file'){try{const f=await idbGet('adhan');if(f){const u=URL.createObjectURL(f);ADH=new Audio(u);ADH.onended=stopAdhan;showStop();if(maxSec)setTimeout(()=>{if(ADH&&ADH.src===u)stopAdhan()},maxSec*1000);await ADH.play();return}}catch(e){stopAdhan()}}
  beep()}
async function showNotif(title,body){try{if(!('Notification' in window)||Notification.permission!=='granted')return;
  const reg=('serviceWorker' in navigator)?await navigator.serviceWorker.getRegistration():null;
  if(reg)await reg.showNotification(title,{body,tag:'attawqit',renotify:true});else new Notification(title,{body})}catch(e){}}
async function toggleMaster(){const nf=PR.nf;
  if(!nf.on){if(!('Notification' in window)){alert(tx('notifBlocked'));return}
    let p=Notification.permission;if(p==='default')p=await Notification.requestPermission();
    if(p!=='granted'){alert(tx('notifBlocked'));return}unlockAudio();nf.on=true}else nf.on=false;
  savePR();view()}
function toggleN(g,p){PR.nf[g][p]=!PR.nf[g][p];savePR();view()}
function setSound(m){PR.snd=m;savePR();view()}
async function pickSound(f){if(!f)return;if(f.size>10485760){alert(tx('tooBig'));return}
  await idbSet('adhan',f);PR.snd='file';PR.sndName=f.name;savePR();view()}
async function removeSound(){try{await idbDel('adhan')}catch(e){}PR.snd='beep';PR.sndName='';savePR();view()}
async function testAdhan(){unlockAudio();await playAdhan(5);if(PR.nf.on)showNotif(PN('Fajr')+' — '+fmt((T||{}).Fajr||'05:00'),M.name||'')}
function tickNotif(){if(!PR.nf.on||!T||location.hash.startsWith('#tv'))return;
  const now=Date.now();
  for(const p of ['Fajr','Sunrise','Dhuhr','Asr','Maghrib','Isha']){
    const tm=T[p];if(!tm)continue;const [h,m]=tm.split(':'),d=new Date();d.setHours(+h,+m,0,0);const diff=now-d;
    if(diff<0||diff>120000)continue;
    const k='nf_'+iso(new Date())+p;try{if(localStorage.getItem(k))continue;localStorage.setItem(k,'1')}catch(e){}
    if(PR.nf.n[p])showNotif(PN(p)+' — '+fmt(tm),M.name||'');
    if(p!=='Sunrise'&&PR.nf.a[p])playAdhan();
  }}
setInterval(tickNotif,5000);

function notifHTML(){const nf=PR.nf,sw=(on,js)=>`<span class="sw ${on?'on':''}" onclick="${js}"></span>`;
  const rows=['Fajr','Sunrise','Dhuhr','Asr','Maghrib','Isha'].map(p=>`<div class="nrow"><span>${PN(p)}</span>${sw(nf.n[p],`toggleN('n','${p}')`)}${p==='Sunrise'?'<span style="text-align:center">—</span>':sw(nf.a[p],`toggleN('a','${p}')`)}</div>`).join('');
  const file=PR.snd==='file';
  return `<div class="glass"><b>${tx('notifT')}</b><div class="nrow"><span>${tx('notifOn')}</span>${sw(nf.on,'toggleMaster()')}<span></span></div>
  <div class="nrow"><span></span><small style="text-align:center">${tx('colNotif')}</small><small style="text-align:center">${tx('colAdhan')}</small></div>${rows}
  <p style="font-size:.85rem;opacity:.8">${tx('notifNote')}</p>
  <b>${tx('soundT')}</b><p><button class="opt ${file?'':'on'}" onclick="setSound('beep')">${tx('soundDef')}</button>
  <label class="opt ${file?'on':''}" style="display:inline-block">${tx('soundFile')} — ${tx('chooseFile')}<input type="file" accept="audio/*" style="display:none" onchange="pickSound(this.files[0])"></label></p>
  ${file?`<p style="font-size:.9rem">🎵 ${esc(PR.sndName)} <button class="opt" onclick="removeSound()">${tx('removeFile')}</button></p>`:''}
  <p><button class="opt on" onclick="testAdhan()">${tx('testAdhan')}</button></p></div>`}

const MIRR=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter','https://maps.mail.ru/osm/tools/overpass/api/interpreter'];
let OVMS=14000;
function osmRow(el,cc){const t=el.tags||{},lat=el.lat??(el.center&&el.center.lat),lng=el.lon??(el.center&&el.center.lon);if(lat==null||lng==null)return null;
  const city=t['addr:city']||t['addr:town']||t['addr:village']||t['addr:suburb']||null;
  let name=String(t.name||t['name:fr']||t['name:ar']||t['name:en']||t.official_name||'').trim();
  if(!name||/^(mosqu[ée]e?|مسجد|جامع)$/i.test(name)){const c=t['addr:street']||t.description||city;name=c?'Mosquée '+c:'Mosquée'}
  return{osm_id:el.type[0]+el.id,name:name.slice(0,200),address:[t['addr:housenumber'],t['addr:street']].filter(Boolean).join(' ')||null,city,postcode:t['addr:postcode']||null,country:cc||null,lat,lng,phone:t.phone||t['contact:phone']||null,website:t.website||t['contact:website']||null}}
async function countryOf(p){try{const j=await(await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=3&lat=${p.lat}&lon=${p.lng}`)).json();return String((j.address&&j.address.country_code)||'').toUpperCase()}catch(e){return ''}}
// ---- Moteur de recherche à plusieurs sources (OpenStreetMap) ----
const enc=encodeURIComponent,sleep=ms=>new Promise(r=>setTimeout(r,ms));
const norm=t=>String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9\u0600-\u06ff]/g,'');
const sameName=(a,b)=>{a=norm(a);b=norm(b);return !!a&&!!b&&(a===b||a.includes(b)||b.includes(a))};
let SRCERR=[];const serr=m=>{if(SRCERR.length<6)SRCERR.push(m)};
async function ovp(q,ms){ms=ms||OVMS;   // 3 serveurs publics en même temps, sans AbortSignal (non transmissible sur certains navigateurs)
  return new Promise(res=>{let left=MIRR.length,done=false;
    const fin=j=>{if(done)return;if(j){done=true;res(j)}else if(--left===0)res(null)};
    const timeout=(u)=>new Promise((_,rj)=>setTimeout(()=>rj(new Error('délai dépassé')),ms));
    MIRR.forEach(u=>{const host=(()=>{try{return new URL(u).host}catch(e){return u}})();
      Promise.race([fetch(u,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'data='+enc(q)}),timeout(u)])
        .then(r=>{if(!r.ok){serr('Overpass '+host+' : erreur '+r.status);return null}return r.json()})
        .then(j=>fin(j)).catch(e=>{serr('Overpass '+host+' : '+(e&&e.message||'réseau bloqué'));fin(null)})})})}
// mosquées « bien étiquetées », bâtiments de mosquée, et lieux de culte dont le nom contient mosquée/masjid/مسجد… même sans l'étiquette religion
const OVF=sel=>`nwr["amenity"="place_of_worship"]["religion"="muslim"]${sel};nwr["building"="mosque"]${sel};nwr["amenity"="place_of_worship"][!"religion"]["name"~"mosqu|masjid|moschee|mezquita|mesquita|cami|مسجد|جامع|مصلى",i]${sel};`;
function nomRow(x,cc){const a=x.address||{},id=(x.osm_type&&x.osm_id)?x.osm_type[0]+x.osm_id:null;if(!id||x.lat==null)return null;
  const nm=String(x.name||a.amenity||String(x.display_name||'').split(',')[0]||'').trim()||'Mosquée';
