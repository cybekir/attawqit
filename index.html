<script>/* Attawqit : la teinte du décor change à chaque version (repère visuel du déploiement) */
(function(){var B=2,H=(185+B*47)%360;
function hx(h,s,l){s/=100;l/=100;var a=s*Math.min(l,1-l);function f(n){var k=(n+h/30)%12,c=l-a*Math.max(-1,Math.min(k-3,9-k,1));return Math.round(255*c).toString(16).padStart(2,'0')}return '#'+f(0)+f(8)+f(4)}
var c=[hx(H,75,12),hx(H,65,22),hx(H,70,36),hx(H,58,49)],r=document.documentElement.style;
r.setProperty('--c1',c[0]);r.setProperty('--c2',c[1]);r.setProperty('--c3',c[2]);r.setProperty('--c4',c[3]);r.setProperty('--c1a',c[0]+'cc');
window.BUILD=B;window.HUE=H;var m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',c[0]);
document.addEventListener('DOMContentLoaded',function(){var d=document.createElement('div');d.id='verbadge';d.textContent='v'+B+' · '+H+'°';
d.style.cssText='position:fixed;left:8px;bottom:6px;z-index:99999;font:11px/1 sans-serif;color:#fff;background:#00000066;padding:4px 7px;border-radius:9px;pointer-events:none;opacity:.8';document.body.appendChild(d)})})();
</script>

<style>:root{--c1:#062f3a;--c2:#0b5a63;--c3:#14a5a3;--c4:#2ec4b6;--c1a:#062f3acc}

:root{--bg:var(--c1);--card:rgba(255,255,255,.14);--ink:#fff;--mute:#bfeeea;--gold:#ffe7b3}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:480px;margin:0 auto;padding:20px}
h1{font-size:1.4rem;margin:0 0 4px}
.mute{color:var(--mute);font-size:.9rem}
.next{margin:20px 0;padding:22px;background:var(--card);border-left:6px solid var(--gold)}
.next b{display:block;font-size:2.2rem}
.row{display:flex;justify-content:space-between;padding:14px 4px;border-bottom:1px solid #ffffff22;font-size:1.2rem}
.row.on{color:var(--gold);font-weight:bold}
.note{margin-top:18px;padding:12px;background:#ffffff12}
nav{margin-top:26px;display:flex;gap:16px}
a{color:var(--gold)}
label{display:block;margin:14px 0 4px;color:var(--mute)}
input,textarea{width:100%;padding:10px;font:inherit;background:#ffffff14;color:var(--ink);border:1px solid #ffffff33}
button{margin-top:18px;padding:12px 20px;font:inherit;background:var(--gold);border:0;color:#2a2200;font-weight:bold}
/* Affichage TV */
.tv{width:100%;height:100vh;height:100dvh;padding:2vh 3vw;display:grid;grid-template-rows:auto auto auto minmax(0,1fr) auto;gap:1.5vh;text-align:center;overflow:hidden;background:linear-gradient(165deg,var(--c1) 0%,var(--c2) 45%,var(--c3) 100%);color:#fff;font-family:'Cormorant Garamond',Georgia,serif;font-weight:600}
.tv h1{font-size:min(3.8vw,7vh);color:var(--gold);margin:0;overflow-wrap:anywhere}
.tv .top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2.4fr) minmax(0,1fr);gap:1.5vw;align-items:center}
.tv .side span{font-size:min(2.4vw,4vh)}.tv .side b{display:block;font-size:min(4.6vw,9vh)}
.tv .clock{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(6px);border-radius:2vw;padding:1.5vh 1vw}
.tv .clock b{display:block;font-size:min(8.5vw,16vh);line-height:1}.tv .clock span{font-size:min(2.6vw,4.5vh)}
.tv .cd{font-size:min(3vw,5.5vh);font-weight:bold}
.tv .grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1vw;align-items:center}
.tv .cell{padding:1.5vh 0;border-radius:1.5vw}
.tv .cell.on{background:linear-gradient(160deg,rgba(255,255,255,.4),rgba(255,255,255,.14));box-shadow:0 0 0 .25vw #ffffffaa}
.tv .cell span{display:block;font-size:min(2.8vw,5vh)}.tv .cell b{display:block;font-size:min(5.6vw,11vh)}.tv .cell i{display:block;font-style:normal;font-size:min(4vw,8vh)}
.tv footer{display:flex;justify-content:space-between;align-items:end;gap:2vw;font-size:min(2vw,3.6vh)}
.tv .brand{color:var(--gold);font-weight:bold}
.ph{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2vh;padding:4vh 6vw}
.ph h2{font-size:min(5.5vw,9vh);margin:0;color:var(--gold)}.ph .big{font-size:min(14vw,28vh);font-weight:bold;line-height:1}
.ph p{font-size:3.4vw;margin:0;max-width:85vw}.ph .ar{font-size:4.4vw;direction:rtl;line-height:1.7}

/* Application mobile (turquoise) */
body.app{background:linear-gradient(165deg,var(--c1) 0%,var(--c2) 45%,var(--c3) 100%) fixed;min-height:100vh;color:#fff;font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-variant-numeric:lining-nums}

.brand{text-align:center;line-height:1.05}.brand b{display:block;font-size:1.8rem;letter-spacing:.05em}.brand span{color:#bfeeea;font-size:1.05rem}

.cd2{text-align:center}.cd2 small{font-size:1.15rem}.cd2 b{display:block;font-size:2.8rem;margin:4px 0 16px}
.bar{height:10px;border-radius:5px;background:linear-gradient(90deg,#fff3c4,#ffd9c0);position:relative;margin:0 14px 18px}.bar i{position:absolute;top:-9px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 0 18px #fff9;transform:translateX(-50%)}
.pills{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pill{border-radius:20px;padding:12px 8px;text-align:center;background:rgba(0,0,0,.18);font-size:1.05rem}.pill.w{background:#f1fbfa;color:#0b4a52}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.pc{background:rgba(255,255,255,.12);border-radius:24px;padding:14px 16px}
.pc>span{font-size:1.2rem;font-variant:small-caps;letter-spacing:.04em}.pc b{display:block;font-size:2.7rem;font-weight:500;margin:2px 0 8px}
.iq{display:flex;justify-content:space-between;font-size:1rem;opacity:.85;font-variant:small-caps}
.pc.next{background:linear-gradient(160deg,rgba(255,255,255,.36),rgba(255,255,255,.14));box-shadow:0 0 0 2px #ffffffaa}
.tabs{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:456px;margin:0 auto;display:flex;background:rgba(6,47,58,.88);border-radius:28px;padding:8px}
.tabs a{flex:1;text-align:center;color:#bfeeea;text-decoration:none;padding:8px 0;border-radius:20px;font-size:.9rem}.tabs a i{display:block;font-style:normal;font-size:1.3rem}.tabs a.on{background:rgba(255,255,255,.2);color:#fff}
.mob button{margin-top:10px;padding:12px 20px;border:0;border-radius:20px;background:#fff;color:#0b4a52;font:inherit;font-weight:700}
.mob a{color:#fff}.mob p{margin:8px 0}
.opt{background:#ffffff1f;border:1px solid #ffffff33;color:#fff;border-radius:14px;padding:11px 14px;font:inherit;margin:4px 6px 0 0;cursor:pointer}.opt.on{background:#ffffff40;border-color:#fff}
.glass select{width:100%;padding:12px;border-radius:12px;background:#ffffff1f;color:#fff;border:1px solid #ffffff33;font:inherit;margin-bottom:6px}.glass select option{color:#000}
.glass p{margin:8px 0}.tabs a{padding:8px 2px;font-size:.74rem;min-width:0}.tabs a i{font-style:normal}
[dir=rtl] .pc b,[dir=rtl] .cd2 b,[dir=rtl] .rnd{direction:ltr;unicode-bidi:isolate}
[dir=rtl] .tv b,[dir=rtl] .tv i,[dir=rtl] .big{direction:ltr;unicode-bidi:isolate}
.tv .cell{background:rgba(0,0,0,.16)}
.tv .brand,.tv h1,.ph h2{color:#ffe7b3}
.tv .clock span,.tv .side span{color:#d9f6f3}
button{background:#fff;color:#0b4a52;border-radius:20px}
.sw{display:inline-block;width:52px;height:30px;border-radius:15px;background:#ffffff33;position:relative;cursor:pointer;justify-self:center}.sw:after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}.sw.on{background:var(--c4)}.sw.on:after{left:25px}
.nrow{display:grid;grid-template-columns:1fr 64px 64px;align-items:center;gap:6px;margin:10px 0}
</style>
</head>

<script>
const R=Math.PI/180,sin=x=>Math.sin(x*R),cos=x=>Math.cos(x*R),tan=x=>Math.tan(x*R),asin=x=>Math.asin(x)/R,acos=x=>Math.acos(x)/R,atan2=(y,x)=>Math.atan2(y,x)/R,fix=(a,b)=>{a-=b*Math.floor(a/b);return a<0?a+b:a};
const ANG={12:[12,12],21:[19,17],18:[18,18],19:[18,17],13:[18,17],4:[18.5,null],5:[19.5,17.5],3:[18,17],2:[15,15],1:[18,18]};
function tzOff(tz,y,m,d){const p={};new Intl.DateTimeFormat('en-US',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric'}).formatToParts(new Date(Date.UTC(y,m-1,d,12))).forEach(x=>p[x.type]=+x.value);return (Date.UTC(p.year,p.month-1,p.day,p.hour,p.minute)-Date.UTC(y,m-1,d,12))/36e5}
function sun(jd){const D=jd-2451545,g=fix(357.529+0.98560028*D,360),q=fix(280.459+0.98564736*D,360),L=fix(q+1.915*sin(g)+0.02*sin(2*g),360),e=23.439-3.6e-7*D,ra=fix(atan2(cos(e)*sin(L),cos(L))/15,24);return{decl:asin(sin(e)*sin(L)),eqt:((q/15-ra+12)%24+24)%24-12}}
function calcDay(y,m,d,lat,lng,tz,method,opt){
  const jd=Date.UTC(y,m-1,d)/864e5+2440587.5-lng/360, off=tzOff(tz,y,m,d)-lng/15, o=opt||{}, P0=ANG[method]||ANG[12], fa=o.fa??P0[0], ia=o.ia===undefined?P0[1]:o.ia;
  const at=(ang,t,ccw)=>{const s=sun(jd+t),v=acos((-sin(ang)-sin(s.decl)*sin(lat))/(cos(s.decl)*cos(lat)))/15;return 12-s.eqt+(ccw?-v:v)};
  const noon=12-sun(jd+.5).eqt,sd=sun(jd+13/24).decl;
  const rise=at(.833,6/24,1),set=at(.833,18/24,0);
  let fajr=at(fa,5/24,1),asr=at(-Math.atan(1/((o.asr||1)+tan(Math.abs(lat-sd))))/R,13/24,0),isha=ia==null?set+(o.imin||90)/60:at(ia,18/24,0);
  const night=rise+24-set; if(isNaN(fajr))fajr=rise-night/7; if(isNaN(isha))isha=set+night/7;
  const f=h=>{h=fix(h+off+.5/60,24);return String(Math.floor(h)).padStart(2,'0')+':'+String(Math.floor((h%1)*60)).padStart(2,'0')};
  return{fajr:f(fajr),sunrise:f(rise),dhuhr:f(noon),asr:f(asr),maghrib:f(set),isha:f(isha)};
}
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const KEY='mosque_v1', P=['Fajr','Sunrise','Dhuhr','Asr','Maghrib','Isha'];
const FR={Fajr:'Fajr',Sunrise:'Chourouq',Dhuhr:'Dhor',Asr:'Asr',Maghrib:'Maghrib',Isha:'Isha'};
const $=s=>document.querySelector(s);
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}};
const def={name:'Ma mosquée',city:'Paris',country:'France',method:12,manual:{},note:'',assoc:'',jumua:'13:30',iqama:{Fajr:10,Dhuhr:10,Asr:10,Maghrib:5,Isha:10}};
let M=Object.assign({},def,load()), T=null;

async function getTimes(){
  const now=new Date(), day=iso(now), row=(M.cal||{})[day]; let t=null;
  if(row) t={Fajr:row.fajr,Sunrise:row.sunrise,Dhuhr:row.dhuhr,Asr:row.asr,Maghrib:row.maghrib,Isha:row.isha};
  else if(M.lat!=null){try{const c=calcDay(now.getFullYear(),now.getMonth()+1,now.getDate(),+M.lat,+M.lng,M.tz||Intl.DateTimeFormat().resolvedOptions().timeZone,M.method,M.calc);t={Fajr:c.fajr,Sunrise:c.sunrise,Dhuhr:c.dhuhr,Asr:c.asr,Maghrib:c.maghrib,Isha:c.isha}}catch(e){}}
  else if(!SLUG&&!PR.pos&&!PR.dir&&!location.hash.startsWith('#tv')){} // pas de position : écran de bienvenue
  else { // mode démo sans mosquée : service externe
    const ck='times_'+day+M.city+M.country+M.method;
    try{const r=await fetch(`https://api.aladhan.com/v1/timingsByCity?city=${encodeURIComponent(M.city)}&country=${encodeURIComponent(M.country)}&method=${M.method}`);t=(await r.json()).data.timings;localStorage.setItem(ck,JSON.stringify(t))}catch(e){try{t=JSON.parse(localStorage.getItem(ck))}catch(_){}}
  }
  if(!t) return null;
  const out={}; P.forEach(p=>out[p]=(M.manual[p]||t[p]||'').slice(0,5)); return out;
}
function nextPrayer(){
  const now=new Date(), list=P.filter(p=>p!=='Sunrise').map(p=>{
    const [h,m]=T[p].split(':'), d=new Date(); d.setHours(+h,+m,0,0); return {p,d};});
  let n=list.find(x=>x.d>now);
  if(!n){n={p:'Fajr',d:new Date(list[0].d.getTime()+864e5)};}
  const s=Math.max(0,Math.floor((n.d-now)/1000));
  const f=[Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(v=>String(v).padStart(2,'0')).join(':');
  return {p:n.p,left:f};
}
const DUR={phones:10,athkar:5}; // minutes
const ATHKAR=[
 {ar:'أَسْتَغْفِرُ الله، أَسْتَغْفِرُ الله، أَسْتَغْفِرُ الله',fr:'Astaghfiru Allah (×3)'},
 {ar:'اللّهُمَّ أَنْتَ السَّلامُ، وَمِنْكَ السَّلام، تَبارَكْتَ يا ذا الجَلالِ وَالإِكْرام',fr:'Allahumma anta Essalam wa mineka Essalam, tabarakta ya dhal djalali wel ikram'},
 {ar:'سُبْحانَ اللهِ، والحَمْدُ لله، واللهُ أكْبَر (٣٣)',fr:'Subhan Allah, wal hamdu lillah, wallahu akbar (×33)'}];
function phase(){
  const f=location.hash.slice(3), now=new Date(), pr=['Fajr','Dhuhr','Asr','Maghrib','Isha'];
  if(f.startsWith('-')) return {k:f.slice(1),p:'Fajr',left:'04:32'};
  for(const p of pr){
    const [h,m]=T[p].split(':'), d=new Date(); d.setHours(+h,+m,0,0); const t=+d;
    const q=((M.iqama||{})[p]??10)*6e4, ad=t+Math.min(2,q/6e4)*6e4, iq=t+q, ph=iq+DUR.phones*6e4, at=ph+DUR.athkar*6e4, n=+now;
    if(n>=t&&n<ad) return {k:'adhan',p};
    if(n>=ad&&n<iq){const s=Math.floor((iq-n)/1000);return {k:'iqama',p,left:String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}}
    if(n>=iq&&n<ph) return {k:'phones',p};
    if(n>=ph&&n<at) return {k:'athkar',p};
  }
  return {k:'main'};
}
function showPhase(x){
  let c='';
  if(x.k==='adhan') c=`<h2>${tx('adhan')}</h2><div class="big">${PN(x.p)}</div>${x.p==='Fajr'?'<div class="ar">الصَّلاةُ خَيْرٌ مِنَ النَّوْم</div><p>Essalatu khayrun mina ennawm</p>':''}`;
  else if(x.k==='iqama') c=`<h2>${tx('iqamaIn').replace('{p}',PN(x.p))}</h2><div class="big">${x.left}</div>`;
  else if(x.k==='phones') c=`<div class="big">📵</div><h2>${tx('phones')}</h2><p>${PN(x.p)}</p>`;
  else {const a=ATHKAR[Math.floor(Date.now()/15000)%ATHKAR.length]; c=`<h2>${tx('athkarT')}</h2><div class="ar">${a.ar}</div><p>${a.fr}</p>`;}
  $('#app').innerHTML=`<div class="tv ph"><h1>${esc(M.name)}</h1>${c}</div>`;
}
function hhmm(t,add){const [h,m]=t.split(':').map(Number),x=h*60+m+add;return String(Math.floor(x/60)%24).padStart(2,'0')+':'+String(x%60).padStart(2,'0')}
function qiblaHTML(){
  const qp=PR.pos||(M.lat!=null?{lat:+M.lat,lng:+M.lng}:null);
  if(!qp) return `<div class="glass">${tx('needpos')}<br><button class="opt on" onclick="usePos()">${tx('usepos')}</button></div>`;
  const r=Math.PI/180,f1=qp.lat*r,f2=21.4225*r,dl=(39.8262-qp.lng)*r;
  const b=((Math.atan2(Math.sin(dl)*Math.cos(f2),Math.cos(f1)*Math.sin(f2)-Math.sin(f1)*Math.cos(f2)*Math.cos(dl))/r)+360)%360;
  return `<div class="glass" style="text-align:center"><small>${tx('qdir')}</small><b style="display:block;font-size:3rem">${Math.round(b)}°</b><small>${Math.round(km(qp.lat,qp.lng,21.4225,39.8262))} km ${tx('fromMecca')}</small>
  <svg id="arr" viewBox="0 0 200 200" width="230" height="230" style="transition:transform .15s"><circle cx="100" cy="100" r="92" fill="none" stroke="#ffffff66" stroke-width="3"/><text x="100" y="26" text-anchor="middle" fill="#fff" font-size="20">N</text><g transform="rotate(${b} 100 100)"><path d="M100 34 L116 112 L100 102 L84 112 Z" fill="#fff3c4"/></g></svg>
  <p>${tx('flat')}</p><button id="cmp">${tx('compass')}</button></div>`;
}
function bindQibla(){const bt=$('#cmp');if(!bt)return;bt.onclick=async()=>{try{
  if(window.DeviceOrientationEvent&&DeviceOrientationEvent.requestPermission&&await DeviceOrientationEvent.requestPermission()!=='granted')return;
  const fn=e=>{const a=$('#arr');if(!a)return;const h=e.webkitCompassHeading??(e.absolute?360-e.alpha:null);if(h!=null)a.style.transform=`rotate(${-h}deg)`};
  addEventListener('deviceorientationabsolute',fn,true);addEventListener('deviceorientation',fn,true);bt.remove()}catch(e){alert(tx('nocompass'))}}}
const PK='prefs_v1';
let PR=Object.assign({lang:'fr',h12:false,method:12,fa:12,ia:12,imin:null,asr:1,pos:null,snd:'beep',sndName:'',nf:{on:false,n:{Fajr:true,Sunrise:true,Dhuhr:true,Asr:true,Maghrib:true,Isha:true},a:{Fajr:true,Dhuhr:true,Asr:true,Maghrib:true,Isha:true}}},(()=>{try{return JSON.parse(localStorage.getItem(PK))||{}}catch(e){return {}}})());
const savePR=()=>{try{localStorage.setItem(PK,JSON.stringify(PR))}catch(e){}};

const idb=()=>new Promise((ok,ko)=>{const r=indexedDB.open('attawqit',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)});
const idbSet=async(k,v)=>{const d=await idb();return new Promise((ok,ko)=>{const t=d.transaction('f','readwrite');t.objectStore('f').put(v,k);t.oncomplete=ok;t.onerror=()=>ko(t.error)})};
const idbGet=async k=>{const d=await idb();return new Promise((ok,ko)=>{const q=d.transaction('f').objectStore('f').get(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>ko(q.error)})};
const idbDel=async k=>{const d=await idb();return new Promise((ok,ko)=>{const t=d.transaction('f','readwrite');t.objectStore('f').delete(k);t.oncomplete=ok;t.onerror=()=>ko(t.error)})};
let ADH=null,AC=null;
function unlockAudio(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}}
function beep(){try{unlockAudio();const t=AC.currentTime;[0,.6,1.2].forEach(d=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=880;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(.0001,t+d);g.gain.exponentialRampToValueAtTime(.4,t+d+.05);g.gain.exponentialRampToValueAtTime(.0001,t+d+.5);o.start(t+d);o.stop(t+d+.55)})}catch(e){}}
function stopAdhan(){if(ADH){try{ADH.pause()}catch(e){}ADH=null}try{const b=document.getElementById('stopA');if(b)b.remove()}catch(e){}}
function showStop(){try{if(document.getElementById('stopA'))return;document.body.insertAdjacentHTML('beforeend',`<button id="stopA" class="opt on" style="position:fixed;top:14px;inset-inline-end:14px;z-index:9">${tx('stopSound')}</button>`);document.getElementById('stopA').onclick=stopAdhan}catch(e){}}
async function playAdhan(maxSec){stopAdhan();
  if(PR.snd==='file'){try{const f=await idbGet('adhan');if(f){const u=URL.createObjectURL(f);ADH=new Audio(u);ADH.onended=stopAdhan;showStop();if(maxSec)setTimeout(()=>{if(ADH&&ADH.src===u)stopAdhan()},maxSec*1000);await ADH.play();return}}catch(e){stopAdhan()}}
  beep()}
async function showNotif(title,body){try{if(!('Notification' in window)||Notification.permission!=='granted')return;
  const reg=('serviceWorker' in navigator)?await navigator.serviceWorker.getRegistration():null;
  if(reg)await reg.showNotification(title,{body,tag:'attawqit',renotify:true});else new Notification(title,{body})}catch(e){}}
async function toggleMaster(){const nf=PR.nf;
  if(!nf.on){if(!('Notification' in window)){alert(tx('notifBlocked'));return}
    let p=Notification.permission;if(p==='default')p=await Notification.requestPermission();
    if(p!=='granted'){alert(tx('notifBlocked'));return}unlockAudio();nf.on=true}else nf.on=false;
  savePR();view()}
function toggleN(g,p){PR.nf[g][p]=!PR.nf[g][p];savePR();view()}

async function pickSound(f){if(!f)return;if(f.size>10485760){alert(tx('tooBig'));return}

function tickNotif(){if(!PR.nf.on||!T||location.hash.startsWith('#tv'))return;
  const now=Date.now();
  for(const p of ['Fajr','Sunrise','Dhuhr','Asr','Maghrib','Isha']){
    const tm=T[p];if(!tm)continue;const [h,m]=tm.split(':'),d=new Date();d.setHours(+h,+m,0,0);const diff=now-d;
    if(diff<0||diff>120000)continue;
    const k='nf_'+iso(new Date())+p;try{if(localStorage.getItem(k))continue;localStorage.setItem(k,'1')}catch(e){}
    if(PR.nf.n[p])showNotif(PN(p)+' — '+fmt(tm),M.name||'');
    if(p!=='Sunrise'&&PR.nf.a[p])playAdhan();
  }}
