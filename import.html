<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#062f3a"><title>Attawqit – Import des mosquées</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#f3ecd8;font-family:Georgia,serif;background:linear-gradient(165deg,#062f3a 0%,#0b5a63 45%,#14a5a3 100%) fixed}
main{max-width:620px;margin:0 auto;padding:20px}h1{font-size:1.5rem}label{display:block;margin:10px 0 4px;color:#cfeeea}
input[type=email],input[type=password]{width:100%;padding:10px;font:inherit;background:#ffffff1f;color:#fff;border:1px solid #ffffff44;border-radius:12px}
button{margin:12px 8px 0 0;padding:11px 18px;font:inherit;background:#ffe7b3;border:0;border-radius:14px;color:#2a2200;font-weight:bold}button:disabled{opacity:.5}
.card{background:#ffffff1f;border-radius:18px;padding:14px;margin:12px 0}.ck{display:inline-block;margin:6px 14px 6px 0}
pre{white-space:pre-wrap;background:#00000040;border-radius:12px;padding:12px;font-size:.85rem;max-height:340px;overflow:auto}code{background:#00000040;padding:2px 6px;border-radius:6px}
</style></head><body><main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script>
const sb=supabase.createClient('https://obnesncbmmfthxmkulof.supabase.co','sb_publishable_urKZCjcq3EpnhS9Ou074ew_69KYE-b9');
const $=s=>document.querySelector(s),app=$('#app'),sleep=ms=>new Promise(r=>setTimeout(r,ms));
// pays : [nom, [sud, ouest, nord, est], découpage en n×n zones pour ne pas surcharger le service]
const C={FR:['France',[41.2,-5.3,51.2,9.7],3],PT:['Portugal',[36.8,-9.6,42.2,-6.1],2],DE:['Allemagne',[47.2,5.8,55.1,15.1],3],IT:['Italie',[35.4,6.6,47.1,18.6],3],ES:['Espagne',[35.9,-9.4,43.9,4.4],3],BE:['Belgique',[49.4,2.5,51.6,6.5],1],NL:['Pays-Bas',[50.7,3.3,53.6,7.3],2],GB:['Royaume-Uni',[49.8,-8.7,60.9,1.8],3],CH:['Suisse',[45.8,5.9,47.9,10.6],1],AT:['Autriche',[46.3,9.5,49.1,17.2],1],TR:['Turquie',[35.8,25.6,42.2,44.9],3],MA:['Maroc',[27.6,-13.3,35.95,-0.9],2],DZ:['Algérie',[18.9,-8.7,37.2,12.0],3],TN:['Tunisie',[30.2,7.5,37.6,11.7],1]};
let U=null,busy=false;
const log=t=>{const p=$('#log');if(p){p.textContent+=t+'\n';p.scrollTop=p.scrollHeight}};
function toRow(el,cc){const t=el.tags||{},lat=el.lat??(el.center&&el.center.lat),lng=el.lon??(el.center&&el.center.lon);if(lat==null||lng==null)return null;
  const name=t.name||t['name:fr']||t['name:en']||t['name:ar']||t.official_name||'Mosquée';
  return{osm_id:el.type[0]+el.id,name:String(name).slice(0,200),address:[t['addr:street'],t['addr:housenumber']].filter(Boolean).join(' ')||null,
    city:t['addr:city']||t['addr:town']||t['addr:village']||t['addr:suburb']||null,postcode:t['addr:postcode']||null,country:cc,lat,lng,
    phone:t.phone||t['contact:phone']||null,website:t.website||t['contact:website']||null}}
async function overpass(q){const r=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'data='+encodeURIComponent(q)});
  if(!r.ok)throw new Error('Service Overpass : erreur '+r.status);return r.json()}
const query=(cc,s,w,n,e)=>`[out:json][timeout:120];area["ISO3166-1"="${cc}"][admin_level=2]->.a;(nwr["amenity"="place_of_worship"]["religion"="muslim"](area.a)(${s},${w},${n},${e});nwr["building"="mosque"](area.a)(${s},${w},${n},${e}););out center tags;`;
function tiles(bb,n){const [s0,w0,n0,e0]=bb,o=[];for(let i=0;i<n;i++)for(let j=0;j<n;j++)o.push([s0+(n0-s0)*i/n,w0+(e0-w0)*j/n,s0+(n0-s0)*(i+1)/n,w0+(e0-w0)*(j+1)/n]);return o}
async function run(){if(busy)return;busy=true;$('#go').disabled=true;
  const sel=[...document.querySelectorAll('input[name=c]:checked')].map(x=>x.value);let total=0;
  for(const cc of sel){const [name,bb,n]=C[cc];log('\n▶ '+name);const got=new Map(),T=tiles(bb,n);
    for(let k=0;k<T.length;k++){let data=null;
      for(let t=1;t<=4&&!data;t++){try{data=await overpass(query(cc,...T[k]))}catch(er){log('  ⚠ '+er.message+' — nouvel essai dans '+t*15+' s');await sleep(t*15000)}}
      if(!data){log('  ✘ zone '+(k+1)+' abandonnée');continue}
      for(const el of data.elements){const r=toRow(el,cc);if(r)got.set(r.osm_id,r)}
      log('  zone '+(k+1)+'/'+T.length+' : '+got.size+' mosquées trouvées');await sleep(3000)}
    const rows=[...got.values()];
    for(let i=0;i<rows.length;i+=500){const r=await sb.from('mosque_directory').upsert(rows.slice(i,i+500),{onConflict:'osm_id'});
      if(r.error){log('  ✘ enregistrement : '+r.error.message);break}log('  enregistré '+Math.min(i+500,rows.length)+'/'+rows.length)}
    total+=rows.length;log('✔ '+name+' : '+rows.length+' mosquées')}
  log('\nTerminé : '+total+' mosquées.');busy=false;$('#go').disabled=false}
async function init(){const {data}=await sb.auth.getSession();U=data.session&&data.session.user;U?home():login()}
function login(){app.innerHTML=`<h1>Attawqit — import des mosquées</h1><div class="card"><label>E-mail</label><input id="e" type="email"><label>Mot de passe</label><input id="p" type="password"><button id="in">Connexion</button></div>`;
  $('#in').onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$('#e').value.trim(),password:$('#p').value});error?alert(error.message):init()}}
async function home(){const r=await sb.from('app_admins').select('user_id').eq('user_id',U.id);
  if(r.error||!r.data||!r.data.length){app.innerHTML=`<h1>Accès réservé</h1><div class="card">Ce compte n’est pas administrateur de l’annuaire.<br><br>Dans Supabase (SQL Editor), exécute :<br><code>insert into app_admins select id from auth.users where email = '${U.email}';</code><br><br>(après avoir exécuté <code>directory.sql</code>), puis recharge cette page.<br><button id="out">Déconnexion</button></div>`;
    $('#out').onclick=async()=>{await sb.auth.signOut();init()};return}
  app.innerHTML=`<h1>Importer les mosquées</h1><div class="card">Source : OpenStreetMap (données libres, © contributeurs OpenStreetMap). L’import peut durer plusieurs minutes : garde cette page ouverte.</div>
  <div class="card">${Object.entries(C).map(([c,v])=>`<label class="ck"><input type="checkbox" name="c" value="${c}" ${['FR','PT','DE','IT'].includes(c)?'checked':''}> ${v[0]}</label>`).join('')}<br><button id="go">Lancer l’import</button></div><pre id="log"></pre>`;
  $('#go').onclick=run}
init();
</script></body></html>
