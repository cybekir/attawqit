<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#062f3a">
<script>/* Attawqit : la teinte du décor change à chaque version (repère visuel du déploiement) */
(function(){var B=2,H=(185+B*47)%360;
function hx(h,s,l){s/=100;l/=100;var a=s*Math.min(l,1-l);function f(n){var k=(n+h/30)%12,c=l-a*Math.max(-1,Math.min(k-3,9-k,1));return Math.round(255*c).toString(16).padStart(2,'0')}return '#'+f(0)+f(8)+f(4)}
var c=[hx(H,75,12),hx(H,65,22),hx(H,70,36),hx(H,58,49)],r=document.documentElement.style;
r.setProperty('--c1',c[0]);r.setProperty('--c2',c[1]);r.setProperty('--c3',c[2]);r.setProperty('--c4',c[3]);r.setProperty('--c1a',c[0]+'cc');
window.BUILD=B;window.HUE=H;var m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',c[0]);
document.addEventListener('DOMContentLoaded',function(){var d=document.createElement('div');d.id='verbadge';d.textContent='v'+B+' · '+H+'°';
d.style.cssText='position:fixed;left:8px;bottom:6px;z-index:99999;font:11px/1 sans-serif;color:#fff;background:#00000066;padding:4px 7px;border-radius:9px;pointer-events:none;opacity:.8';document.body.appendChild(d)})})();
</script><title>Attawqit – Import des mosquées</title>
<style>:root{--c1:#062f3a;--c2:#0b5a63;--c3:#14a5a3;--c4:#2ec4b6;--c1a:#062f3acc}

*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#f3ecd8;font-family:Georgia,serif;background:linear-gradient(165deg,var(--c1) 0%,var(--c2) 45%,var(--c3) 100%) fixed}
main{max-width:620px;margin:0 auto;padding:20px}h1{font-size:1.5rem}label{display:block;margin:10px 0 4px;color:#cfeeea}
input[type=email],input[type=password]{width:100%;padding:10px;font:inherit;background:#ffffff1f;color:#fff;border:1px solid #ffffff44;border-radius:12px}
button{margin:12px 8px 0 0;padding:11px 18px;font:inherit;background:#ffe7b3;border:0;border-radius:14px;color:#2a2200;font-weight:bold}button:disabled{opacity:.5}
.card{background:#ffffff1f;border-radius:18px;padding:14px;margin:12px 0}.ck{display:inline-block;margin:6px 14px 6px 0}
pre{white-space:pre-wrap;background:#00000040;border-radius:12px;padding:12px;font-size:.85rem;max-height:340px;overflow:auto}code{background:#00000040;padding:2px 6px;border-radius:6px}
</style></head><body><main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script>
const sb=supabase.createClient('https://obnesncbmmfthxmkulof.supabase.co','sb_publishable_urKZCjcq3EpnhS9Ou074ew_69KYE-b9');
const $=s=>document.querySelector(s),app=$('#app'),sleep=ms=>new Promise(r=>setTimeout(r,ms));
// pays : [nom, [sud, ouest, nord, est], découpage en n×n zones pour ne pas surcharger le service]
const C={FR:['France',[41.2,-5.3,51.2,9.7],3],PT:['Portugal',[36.8,-9.6,42.2,-6.1],2],DE:['Allemagne',[47.2,5.8,55.1,15.1],3],IT:['Italie',[35.4,6.6,47.1,18.6],3],ES:['Espagne',[35.9,-9.4,43.9,4.4],3],BE:['Belgique',[49.4,2.5,51.6,6.5],1],NL:['Pays-Bas',[50.7,3.3,53.6,7.3],2],GB:['Royaume-Uni',[49.8,-8.7,60.9,1.8],3],CH:['Suisse',[45.8,5.9,47.9,10.6],1],AT:['Autriche',[46.3,9.5,49.1,17.2],1],TR:['Turquie',[35.8,25.6,42.2,44.9],3],MA:['Maroc',[27.6,-13.3,35.95,-0.9],2],DZ:['Algérie',[18.9,-8.7,37.2,12.0],3],TN:['Tunisie',[30.2,7.5,37.6,11.7],1],CA:['Canada',[41.6,-141,70,-52.6],4],SN:['Sénégal',[12.3,-17.6,16.7,-11.3],1]};
const MIRRORS=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter','https://maps.mail.ru/osm/tools/overpass/api/interpreter'];
let U=null,busy=false;
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const log=t=>{const p=$('#log');if(p){p.textContent+=t+'\n';p.scrollTop=p.scrollHeight}};
function toRow(el,cc){const t=el.tags||{},lat=el.lat??(el.center&&el.center.lat),lng=el.lon??(el.center&&el.center.lon);if(lat==null||lng==null)return null;
  const city=t['addr:city']||t['addr:town']||t['addr:village']||t['addr:suburb']||t['addr:district']||t['is_in:city']||t['is_in:town']||null;
  let name=(t.name||t['name:fr']||t['name:ar']||t['name:en']||t.official_name||t.alt_name||'').trim();
  if(!name||/^(mosqu[ée]e?|مسجد|جامع)$/i.test(name)){const ctx=t['addr:street']||t.description||t.ref||city;name=ctx?'Mosquée '+ctx:'Mosquée'}   // nom descriptif si OSM n'en donne pas
  return{osm_id:el.type[0]+el.id,name:String(name).slice(0,200),address:[t['addr:housenumber'],t['addr:street']||t['addr:full']].filter(Boolean).join(' ')||null,
    city:city,postcode:t['addr:postcode']||null,country:cc,lat,lng,
    phone:t.phone||t['contact:phone']||null,website:t.website||t['contact:website']||null}}
async function overpass(q){let last='aucun serveur joignable';   // essaie 3 serveurs publics à la suite
  for(const u of MIRRORS){try{const r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'data='+encodeURIComponent(q)});
    if(r.ok)return await r.json();last='erreur '+r.status}catch(e){last=e.message}}
  throw new Error('Service Overpass : '+last)}
const query=(cc,s,w,n,e)=>`[out:json][timeout:120];area["ISO3166-1"="${cc}"][admin_level=2]->.a;(nwr["amenity"="place_of_worship"]["religion"="muslim"](area.a)(${s},${w},${n},${e});nwr["building"="mosque"](area.a)(${s},${w},${n},${e}););out center tags;`;
function tiles(bb,n){const [s0,w0,n0,e0]=bb,o=[];for(let i=0;i<n;i++)for(let j=0;j<n;j++)o.push([s0+(n0-s0)*i/n,w0+(e0-w0)*j/n,s0+(n0-s0)*(i+1)/n,w0+(e0-w0)*(j+1)/n]);return o}
async function run(){if(busy)return;busy=true;$('#go').disabled=true;
  const sel=[...document.querySelectorAll('input[name=c]:checked')].map(x=>x.value);let total=0;
  for(const cc of sel){const [name,bb,n]=C[cc];log('\n▶ '+name);const got=new Map(),T=tiles(bb,n);
    for(let k=0;k<T.length;k++){let data=null;
      for(let t=1;t<=4&&!data;t++){try{data=await overpass(query(cc,...T[k]))}catch(er){log('  ⚠ '+er.message+' — nouvel essai dans '+t*15+' s');await sleep(t*15000)}}
      if(!data){log('  ✘ zone '+(k+1)+' abandonnée');continue}
      for(const el of data.elements){const r=toRow(el,cc);if(r)got.set(r.osm_id,r)}
      log('  zone '+(k+1)+'/'+T.length+' : '+got.size+' mosquées trouvées');await sleep(3000)}
    const rows=[...got.values()];
    for(let i=0;i<rows.length;i+=500){const r=await sb.from('mosque_directory').upsert(rows.slice(i,i+500),{onConflict:'osm_id'});
      if(r.error){log('  ✘ enregistrement : '+r.error.message);break}log('  enregistré '+Math.min(i+500,rows.length)+'/'+rows.length)}
    total+=rows.length;log('✔ '+name+' : '+rows.length+' mosquées')}
  log('\nTerminé : '+total+' mosquées.');busy=false;$('#go').disabled=false}
async function loadSug(){const box=$('#sug');const r=await sb.from('mosque_suggestions').select('*').eq('status','new').order('created_at');
  if(r.error){box.textContent=r.error.message+' (as-tu exécuté claims_and_suggestions.sql ?)';return}
  box.innerHTML=r.data.length?r.data.map(x=>`<div class="card"><b>${esc(x.name)}</b><br>${esc([x.address,x.city,x.country].filter(Boolean).join(', '))}<br>${x.lat!=null?x.lat.toFixed(4)+', '+x.lng.toFixed(4):'(sans position : sera géocodée)'}<br><button data-ok="${esc(x.id)}">Ajouter à l’annuaire</button><button data-no="${esc(x.id)}" style="background:#ffffff33;color:#fff">Rejeter</button></div>`).join(''):'<div class="card">Aucune suggestion en attente.</div>';
  box.querySelectorAll('[data-ok]').forEach(b=>b.onclick=()=>approve(r.data.find(x=>x.id===b.dataset.ok)));
  box.querySelectorAll('[data-no]').forEach(b=>b.onclick=async()=>{await sb.from('mosque_suggestions').delete().eq('id',b.dataset.no);loadSug()})}
async function approve(x){let lat=x.lat,lng=x.lng;
  if(lat==null){try{const q=[x.address,x.city].filter(Boolean).join(', ');const j=await(await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q='+encodeURIComponent(q)+(x.country?'&countrycodes='+x.country.toLowerCase():''))).json();if(!j[0])throw 0;lat=+j[0].lat;lng=+j[0].lon}catch(e){alert('Adresse introuvable : rejette la suggestion ou ajoute-la à la main.');return}}
  const r=await sb.from('mosque_directory').upsert({osm_id:'s-'+x.id,name:x.name,address:x.address,city:x.city,country:x.country,lat,lng},{onConflict:'osm_id'});
  if(r.error){alert(r.error.message);return}await sb.from('mosque_suggestions').delete().eq('id',x.id);loadSug()}
async function runCity(){if(busy)return;const city=$('#cq').value.trim(),cc=$('#ck').value;if(!city)return;busy=true;$('#goc').disabled=true;
  try{log('\n▶ '+city+' ('+(C[cc]?C[cc][0]:cc)+')');
    const g=await(await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q='+encodeURIComponent(city)+'&countrycodes='+cc.toLowerCase())).json();
    if(!g[0]){log('  ✘ ville introuvable');return}
    const [s,n,w,e]=g[0].boundingbox.map(Number);
    const q=`[out:json][timeout:90];(nwr["amenity"="place_of_worship"]["religion"="muslim"](${s},${w},${n},${e});nwr["building"="mosque"](${s},${w},${n},${e}););out center tags;`;
    const data=await overpass(q),got=new Map();for(const el of data.elements){const r=toRow(el,cc);if(r)got.set(r.osm_id,r)}
    const rows=[...got.values()];log('  '+rows.length+' mosquées trouvées');
    if(rows.length){const r=await sb.from('mosque_directory').upsert(rows,{onConflict:'osm_id'});log(r.error?'  ✘ '+r.error.message:'✔ '+rows.length+' mosquées enregistrées')}
  }catch(er){log('  ✘ '+er.message)}finally{busy=false;$('#goc').disabled=false}}
async function init(){const {data}=await sb.auth.getSession();U=data.session&&data.session.user;U?home():login()}
function login(){app.innerHTML=`<h1>Attawqit — import des mosquées</h1><div class="card"><label>E-mail</label><input id="e" type="email"><label>Mot de passe</label><input id="p" type="password"><button id="in">Connexion</button></div>`;
  $('#in').onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$('#e').value.trim(),password:$('#p').value});error?alert(error.message):init()}}
async function home(){const r=await sb.from('app_admins').select('user_id').eq('user_id',U.id);
  if(r.error||!r.data||!r.data.length){app.innerHTML=`<h1>Accès réservé</h1><div class="card">Ce compte n’est pas administrateur de l’annuaire.<br><br>Dans Supabase (SQL Editor), exécute :<br><code>insert into app_admins select id from auth.users where email = '${U.email}';</code><br><br>(après avoir exécuté <code>directory.sql</code>), puis recharge cette page.<br><button id="out">Déconnexion</button></div>`;
    $('#out').onclick=async()=>{await sb.auth.signOut();init()};return}
  app.innerHTML=`<h1>Importer les mosquées</h1><div class="card">Source : OpenStreetMap (données libres, © contributeurs OpenStreetMap). L’import peut durer plusieurs minutes : garde cette page ouverte.</div>
  <div class="card">${Object.entries(C).map(([c,v])=>`<label class="ck"><input type="checkbox" name="c" value="${c}" ${['FR','PT','DE','IT'].includes(c)?'checked':''}> ${v[0]}</label>`).join('')}<br><button id="go">Lancer l’import</button></div><pre id="log"></pre><h1>Importer une seule ville</h1><div class="card"><label>Ville</label><input id="cq" placeholder="ex. Lyon" style="width:100%;padding:10px;font:inherit;background:#ffffff1f;color:#fff;border:1px solid #ffffff44;border-radius:12px"><label>Pays</label><select id="ck" style="width:100%;padding:10px;font:inherit;border-radius:12px">${Object.entries(C).map(([c,v])=>`<option value="${c}">${v[0]}</option>`).join('')}</select><button id="goc">Importer cette ville</button></div><h1>Suggestions des utilisateurs</h1><div id="sug"></div>`;
  $('#go').onclick=run;$('#goc').onclick=runCity;loadSug()}
init();
</script></body></html>
