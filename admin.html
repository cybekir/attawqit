<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tawqit – Espace mosquée</title>
<style>
:root{--bg:#0f2a26;--card:#17403a;--ink:#f3ecd8;--mute:#9db8ae;--gold:#e0b84c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,serif}
main{max-width:560px;margin:0 auto;padding:20px}h1{font-size:1.5rem}h2{color:var(--gold);margin-top:30px}
label{display:block;margin:12px 0 4px;color:var(--mute)}
input,select{width:100%;padding:10px;font:inherit;background:#ffffff14;color:var(--ink);border:1px solid #ffffff33}
select option{color:#000}
button{margin:14px 8px 0 0;padding:11px 18px;font:inherit;background:var(--gold);border:0;color:#2a2200;font-weight:bold}
button.alt{background:transparent;color:var(--gold);border:1px solid var(--gold)}
.card{background:var(--card);padding:14px;margin:12px 0}.g{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
a{color:var(--gold)}
</style></head>
<body><main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script>
const sb=supabase.createClient('https://obnesncbmmfthxmkulof.supabase.co','sb_publishable_urKZCjcq3EpnhS9Ou074ew_69KYE-b9');
const $=s=>document.querySelector(s), app=$('#app'), v=i=>$('#'+i).value.trim(), msg=t=>alert(t);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const slugify=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const P=['fajr','dhuhr','asr','maghrib','isha'], FR={fajr:'Fajr',dhuhr:'Dhuhr',asr:'Asr',maghrib:'Maghrib',isha:'Isha'};
const METHODS=[[12,'France — UOIF (Fajr 12°, Isha 12°)'],[3,'Ligue islamique mondiale (18° / 17°)'],[21,'Maroc (19° / 17°)'],[18,'Tunisie (18° / 18°)'],[19,'Algérie (18° / 17°)'],[13,'Turquie — Diyanet (18° / 17°)'],[4,'Arabie saoudite — Umm al-Qura (18,5° / 90 min)'],[5,'Égypte (19,5° / 17,5°)'],[2,'Amérique du Nord — ISNA (15° / 15°)'],[1,'Karachi (18° / 18°)'],[0,'Personnalisé (je choisis les angles)']];
const ANGS=[12,13,14,15,16,17,17.5,18,18.5,19,19.5,20];
const OFF={maroc:21,morocco:21,tunisie:18,tunisia:18,'algérie':19,algerie:19,algeria:19,turquie:13,turkey:13,'arabie saoudite':4,'saudi arabia':4,'égypte':5,egypte:5,egypt:5};
const opts=()=>({fa:+v('fa'),ia:v('ia')===''?null:+v('ia'),imin:v('im')===''?null:+v('im'),asr:+v('asr2')});
const R=Math.PI/180,sin=x=>Math.sin(x*R),cos=x=>Math.cos(x*R),tan=x=>Math.tan(x*R),asin=x=>Math.asin(x)/R,acos=x=>Math.acos(x)/R,atan2=(y,x)=>Math.atan2(y,x)/R,fix=(a,b)=>{a-=b*Math.floor(a/b);return a<0?a+b:a};
const ANG={12:[12,12],21:[19,17],18:[18,18],19:[18,17],13:[18,17],4:[18.5,null],5:[19.5,17.5],3:[18,17],2:[15,15],1:[18,18]};
function tzOff(tz,y,m,d){const p={};new Intl.DateTimeFormat('en-US',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric'}).formatToParts(new Date(Date.UTC(y,m-1,d,12))).forEach(x=>p[x.type]=+x.value);return (Date.UTC(p.year,p.month-1,p.day,p.hour,p.minute)-Date.UTC(y,m-1,d,12))/36e5}
function sun(jd){const D=jd-2451545,g=fix(357.529+0.98560028*D,360),q=fix(280.459+0.98564736*D,360),L=fix(q+1.915*sin(g)+0.02*sin(2*g),360),e=23.439-3.6e-7*D,ra=fix(atan2(cos(e)*sin(L),cos(L))/15,24);return{decl:asin(sin(e)*sin(L)),eqt:((q/15-ra+12)%24+24)%24-12}}
function calcDay(y,m,d,lat,lng,tz,method,opt){
  const jd=Date.UTC(y,m-1,d)/864e5+2440587.5-lng/360, off=tzOff(tz,y,m,d)-lng/15, o=opt||{}, P0=ANG[method]||ANG[12], fa=o.fa??P0[0], ia=o.ia===undefined?P0[1]:o.ia;
  const at=(ang,t,ccw)=>{const s=sun(jd+t),v=acos((-sin(ang)-sin(s.decl)*sin(lat))/(cos(s.decl)*cos(lat)))/15;return 12-s.eqt+(ccw?-v:v)};
  const noon=12-sun(jd+.5).eqt,sd=sun(jd+13/24).decl;
  const rise=at(.833,6/24,1),set=at(.833,18/24,0);
  let fajr=at(fa,5/24,1),asr=at(-Math.atan(1/((o.asr||1)+tan(Math.abs(lat-sd))))/R,13/24,0),isha=ia==null?set+(o.imin||90)/60:at(ia,18/24,0);
  const night=rise+24-set; if(isNaN(fajr))fajr=rise-night/7; if(isNaN(isha))isha=set+night/7;
  const f=h=>{h=fix(h+off+.5/60,24);return String(Math.floor(h)).padStart(2,'0')+':'+String(Math.floor((h%1)*60)).padStart(2,'0')};
  return{fajr:f(fajr),sunrise:f(rise),dhuhr:f(noon),asr:f(asr),maghrib:f(set),isha:f(isha)};
}

const tm=x=>{const m=/^(\d{1,2})[:h](\d{2})/.exec((x||'').trim());return m?m[1].padStart(2,'0')+':'+m[2]:null};
function parseCSV(t,id){const out=[];t.split(/\r?\n/).forEach(l=>{const c=l.split(/[;,\t]/).map(x=>x.trim());let d=c[0],m;
  if(m=/^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(d))d=`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  else if(m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(d))d=`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`; else return;
  const w=c.slice(1).map(tm), r=c.length>=7?{fajr:w[0],sunrise:w[1],dhuhr:w[2],asr:w[3],maghrib:w[4],isha:w[5]}:{fajr:w[0],sunrise:null,dhuhr:w[1],asr:w[2],maghrib:w[3],isha:w[4]};
  if(r.fajr&&r.dhuhr&&r.asr&&r.maghrib&&r.isha)out.push({mosque_id:id,day:d,...r})});return out}
const stat=t=>{const e=$('#st');if(e)e.textContent=t};
async function push(rows){for(let i=0;i<rows.length;i+=400){stat(`Enregistrement ${Math.min(i+400,rows.length)}/${rows.length}…`);
  const r=await sb.from('prayer_calendar').upsert(rows.slice(i,i+400),{onConflict:'mosque_id,day'});if(r.error)return msg(r.error.message)}stat(`✔ ${rows.length} jours enregistrés.`)}
function yearDays(y){const a=[];for(let d=new Date(Date.UTC(y,0,1));d.getUTCFullYear()===y;d=new Date(+d+864e5))a.push([d.getUTCFullYear(),d.getUTCMonth()+1,d.getUTCDate(),d.toISOString().slice(0,10)]);return a}
let U=null;

async function init(){const {data}=await sb.auth.getSession();U=data.session?.user;U?list():login();}

function login(){
  app.innerHTML=`<h1>Tawqit</h1><p>Espace mosquée</p><label>E-mail</label><input id="e" type="email"><label>Mot de passe (6 caractères minimum)</label><input id="p" type="password"><button id="in">Connexion</button><button id="up" class="alt">Créer un compte</button>`;
  $('#in').onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:v('e'),password:$('#p').value});error?msg(error.message):init()};
  $('#up').onclick=async()=>{const {data,error}=await sb.auth.signUp({email:v('e'),password:$('#p').value});
    if(error) return msg(error.message);
    data.session?init():msg('Compte créé. Confirme ton e-mail, puis connecte-toi.')};
}

async function list(){
  const {data,error}=await sb.from('mosque_users').select('mosques(id,name,city)').eq('user_id',U.id);
  if(error) return msg(error.message);
  const ms=data.map(r=>r.mosques).filter(Boolean);
  app.innerHTML=`<h1>Mes mosquées</h1>${ms.map(m=>`<div class="card"><b>${esc(m.name)}</b><br>${esc(m.city)}<br><button data-id="${m.id}">Gérer</button></div>`).join('')||'<p>Aucune mosquée pour le moment.</p>'}<button id="new">+ Ajouter une mosquée</button><button id="out" class="alt">Déconnexion</button>`;
  document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>edit(b.dataset.id));
  $('#new').onclick=()=>edit(); $('#out').onclick=async()=>{await sb.auth.signOut();init()};
}

async function edit(id){
  let m={country:'France'}, s={}, a=[];
  if(id){
    m=(await sb.from('mosques').select('*').eq('id',id).single()).data;
    s=(await sb.from('mosque_settings').select('*').eq('mosque_id',id).single()).data||{};
    a=(await sb.from('announcements').select('*').eq('mosque_id',id).order('sort')).data||[];
  }
  const c=(s.fixed_minutes||{}).calc||{}, pre=ANG[s.calc_method??12]||ANG[12], fa0=c.fa??pre[0], ia0=c.ia===undefined?pre[1]:c.ia;
  const w=(s.iqama||{}).wait_min||{fajr:30,dhuhr:10,asr:10,maghrib:10,isha:10};
  const f=(i,l,val,t='text')=>`<label>${l}</label><input id="${i}" type="${t}" value="${esc(val)}">`;
  app.innerHTML=`<p><a href="#" id="back">← Mes mosquées</a></p><h1>${esc(m.name)||'Nouvelle mosquée'}</h1>
  ${id?`<div class="card">Écran télé : <a href="/?m=${m.slug}#tv" target="_blank">/?m=${m.slug}#tv</a><br>Version mobile : <a href="/?m=${m.slug}" target="_blank">/?m=${m.slug}</a></div>`:''}
  <h2>Fiche de la mosquée</h2>
  ${f('n','Nom *',m.name)}${f('ad','Adresse',m.address)}
  <div class="g"><div>${f('ci','Ville',m.city)}</div><div>${f('pc','Code postal',m.postal_code)}</div></div>
  ${f('co','Pays *',m.country)}
  <div class="g"><div>${f('la','Latitude *',m.lat,'number')}</div><div>${f('lo','Longitude *',m.lng,'number')}</div></div>
  <button class="alt" id="gps">Utiliser ma position actuelle</button>
  ${f('as','Nom de l’association',m.association)}${f('ph','Téléphone',m.phone,'tel')}${f('em','E-mail',m.email,'email')}
  <h2>Horaires</h2>
  <label>Source de calcul des horaires</label>
  <select id="src">${[['auto','Automatique (calcul par angle du soleil)'],['calendar','Calendrier (je saisis ou j’importe mes horaires en CSV)'],['official','Autorités officielles du pays'],['diyanet','Diyanet İşleri Başkanlığı (Turquie)']].map(([k,n])=>`<option value="${k}" ${(s.calc_source==='api'||!s.calc_source?'auto':s.calc_source)===k?'selected':''}>${n}</option>`).join('')}</select>
  <div id="autoBox">
  <label>Organisme / jurisprudence (pré-remplit les angles)</label><select id="me">${METHODS.map(([k,n])=>`<option value="${k}" ${(s.calc_method??12)==k?'selected':''}>${n}</option>`).join('')}</select>
  <div class="g"><div><label>Angle du Fajr (°)</label><select id="fa">${ANGS.map(x=>`<option ${fa0==x?'selected':''}>${x}</option>`).join('')}</select></div>
  <div><label>Angle de l’Isha (°)</label><select id="ia"><option value="" ${ia0==null?'selected':''}>— (utiliser les minutes)</option>${ANGS.map(x=>`<option ${ia0==x?'selected':''}>${x}</option>`).join('')}</select></div></div>
  ${f('im','Isha : minutes après le Maghrib (vide = utiliser l’angle)',c.imin??(ia0==null?90:''),'number')}
  <label>Calcul de l’Asr</label><select id="asr2"><option value="1" ${(c.asr||1)==1?'selected':''}>Standard (Chafi’i, Maliki, Hanbali)</option><option value="2" ${c.asr==2?'selected':''}>Hanafi</option></select>
  <p style="color:var(--mute);font-size:.85rem">Plus l’angle est grand, plus le Fajr est tôt et l’Isha tardive. Le choix de l’organisme dépend de ta mosquée.</p></div>
  ${f('tz','Fuseau horaire (ex. Europe/Paris)',s.timezone||Intl.DateTimeFormat().resolvedOptions().timeZone)}
  <label>Délai adhan → iqama (minutes)</label>
  <div class="g">${P.map(p=>`<div>${f('w_'+p,FR[p],w[p],'number')}</div>`).join('')}<div>${f('ju','Jumua (heure)',(s.jumua||{}).time||'13:00','time')}</div></div>
  <button id="save">Enregistrer</button>
  ${id?`<h2>Calendrier des horaires</h2><p style="color:var(--mute)">Choisis le calcul automatique (par angle du soleil) ou importe ton propre fichier CSV. Les horaires sont enregistrés dans la base : l’écran les lit même sans internet.</p>
  <div id="csvBox"><label>Ou importer un fichier CSV (date;fajr;chourouk;dhuhr;asr;maghrib;isha)</label><input type="file" id="csv" accept=".csv,.txt">
  <button id="impcsv">Importer le CSV</button><button class="alt" id="tpl">Télécharger un modèle CSV</button></div><p id="st"></p>`:''}
  ${id?`<h2>Annonces</h2>${a.map(x=>`<div class="card">${esc(x.content)}<br><button class="alt" data-del="${x.id}">Supprimer</button></div>`).join('')}
  <label>Nouvelle annonce</label><input id="an"><button id="adda">Ajouter l’annonce</button>`:''}`;
  $('#me').onchange=()=>{const p=ANG[+v('me')];if(p){$('#fa').value=p[0];$('#ia').value=p[1]??'';$('#im').value=p[1]==null?90:''}};
  const sync=()=>{const x=v('src');$('#autoBox').style.display=x==='calendar'?'none':'block';const cb=$('#csvBox');if(cb)cb.style.display=x==='calendar'?'block':'none';
    if(x==='diyanet'){$('#me').value=13;$('#me').onchange()}
    if(x==='official'){const k=OFF[v('co').toLowerCase()];if(k){$('#me').value=k;$('#me').onchange()}else msg('Pas d’autorité unique connue pour ce pays : choisis l’organisme dans la liste.')}};
  $('#src').onchange=sync; {const x=v('src');$('#autoBox').style.display=x==='calendar'?'none':'block';const cb=$('#csvBox');if(cb)cb.style.display=x==='calendar'?'block':'none'}
  $('#back').onclick=e=>{e.preventDefault();list()};
  $('#gps').onclick=()=>navigator.geolocation.getCurrentPosition(p=>{$('#la').value=p.coords.latitude;$('#lo').value=p.coords.longitude},()=>msg('Position refusée ou indisponible.'));
  $('#save').onclick=async()=>{
    if(!v('n')||!v('co')||!v('la')||!v('lo')) return msg('Nom, pays et position GPS sont obligatoires.');
    const row={name:v('n'),address:v('ad'),city:v('ci'),postal_code:v('pc'),country:v('co'),lat:+v('la'),lng:+v('lo'),association:v('as'),phone:v('ph'),email:v('em'),updated_at:new Date().toISOString()};
    let mid=id;
    if(!mid){
      row.slug=slugify(v('n')+' '+v('ci'))||'mosquee-'+Date.now();
      const r=await sb.from('mosques').insert(row).select().single();
      if(r.error) return msg(r.error.message); mid=r.data.id;
    } else { const r=await sb.from('mosques').update(row).eq('id',mid); if(r.error) return msg(r.error.message); }
    const wait={}; P.forEach(p=>wait[p]=+v('w_'+p));
    const r2=await sb.from('mosque_settings').update({calc_source:v('src'),calc_method:+v('me'),timezone:v('tz'),fixed_minutes:{...(s.fixed_minutes||{}),calc:opts()},iqama:{...(s.iqama||{}),wait_min:wait},jumua:{...(s.jumua||{}),time:v('ju')||null}}).eq('mosque_id',mid);
    if(r2.error) return msg(r2.error.message);
    if(v('src')!=='calendar'){const y0=new Date().getFullYear(),rows=[],o=opts();
      try{[y0,y0+1,y0+2].forEach(y=>yearDays(y).forEach(([Y,M,D,iso])=>rows.push({mosque_id:mid,day:iso,...calcDay(Y,M,D,+v('la'),+v('lo'),v('tz'),+v('me'),o)})))}
      catch(e){return msg('Vérifie le fuseau horaire (ex. Europe/Paris) et la position GPS.')}
      await push(rows);}
    msg('Enregistré ✔'+(v('src')!=='calendar'?' — horaires calculés pour 3 ans et enregistrés dans la base.':'')); edit(mid);
  };
  if(id){
    $('#impcsv').onclick=async()=>{const fl=$('#csv').files[0];if(!fl)return msg('Choisis un fichier CSV.');
      const rows=parseCSV(await fl.text(),id);if(!rows.length)return msg('Aucune ligne valide. Format : date;fajr;chourouk;dhuhr;asr;maghrib;isha');await push(rows)};
    $('#tpl').onclick=()=>{const y=new Date().getFullYear(),L=['date;fajr;chourouk;dhuhr;asr;maghrib;isha'];
      try{yearDays(y).forEach(([Y,M,D,iso])=>{const c=calcDay(Y,M,D,+v('la'),+v('lo'),v('tz'),+v('me'),opts());L.push([iso,c.fajr,c.sunrise,c.dhuhr,c.asr,c.maghrib,c.isha].join(';'))})}catch(e){return msg('Renseigne la position GPS et le fuseau.')}
      const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([L.join('\n')],{type:'text/csv'}));a.download='horaires-'+y+'.csv';a.click()};
    $('#adda').onclick=async()=>{if(!v('an'))return;const r=await sb.from('announcements').insert({mosque_id:id,content:v('an'),kind:'text'});r.error?msg(r.error.message):edit(id)};
    document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{await sb.from('announcements').delete().eq('id',b.dataset.del);edit(id)});
  }
}
init();
</script></body></html>
