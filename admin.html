<title>Attawqit – Espace mosquée</title>
<style>:root{--c1:#062f3a;--c2:#0b5a63;--c3:#14a5a3;--c4:#2ec4b6;--c1a:#062f3acc}

:root{--ink:#fff;--mute:#bfeeea;--gold:#ffe7b3}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:1.1rem;background:linear-gradient(165deg,var(--c1) 0%,var(--c2) 45%,var(--c3) 100%) fixed}
main{max-width:560px;margin:0 auto;padding:20px}
h1{font-size:1.9rem;margin:.4em 0}h2{color:var(--gold);margin-top:30px;font-size:1.5rem}
label{display:block;margin:14px 0 4px;color:var(--mute)}
input,select{width:100%;padding:12px;font:inherit;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:14px}
input::placeholder{color:#d9f6f3aa}
select option{color:#000}
button{margin:14px 8px 0 0;padding:12px 22px;font:inherit;font-weight:700;background:#fff;border:0;color:#0b4a52;border-radius:22px;cursor:pointer}
button.alt{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.55)}
.card{background:linear-gradient(160deg,rgba(255,255,255,.2),rgba(255,255,255,.08));border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(8px);border-radius:22px;padding:16px;margin:14px 0}
.g{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
a{color:var(--gold)}
[dir=rtl] input[type=email],[dir=rtl] input[type=number],[dir=rtl] input[type=tel],[dir=rtl] input[type=time],[dir=rtl] input[type=password]{direction:ltr;text-align:right}
input[type=checkbox]{width:auto;margin:0 6px}.ck{display:inline-block;margin:6px 14px 6px 0}.thumb{display:inline-block;position:relative;margin:6px}.thumb img{width:110px;height:80px;object-fit:cover;border-radius:10px}.thumb button{position:absolute;top:-6px;right:-6px;margin:0;padding:2px 8px;border-radius:50%}
#map{height:280px;border-radius:14px;margin:8px 0;z-index:0}

  const jd=Date.UTC(y,m-1,d)/864e5+2440587.5-lng/360, off=tzOff(tz,y,m,d)-lng/15, o=opt||{}, P0=ANG[method]||ANG[12], fa=o.fa??P0[0], ia=o.ia===undefined?P0[1]:o.ia;
  const at=(ang,t,ccw)=>{const s=sun(jd+t),v=acos((-sin(ang)-sin(s.decl)*sin(lat))/(cos(s.decl)*cos(lat)))/15;return 12-s.eqt+(ccw?-v:v)};
  const noon=12-sun(jd+.5).eqt,sd=sun(jd+13/24).decl;
  const rise=at(.833,6/24,1),set=at(.833,18/24,0);
  let fajr=at(fa,5/24,1),asr=at(-Math.atan(1/((o.asr||1)+tan(Math.abs(lat-sd))))/R,13/24,0),isha=ia==null?set+(o.imin||90)/60:at(ia,18/24,0);
  const night=rise+24-set; if(isNaN(fajr))fajr=rise-night/7; if(isNaN(isha))isha=set+night/7;
  const f=h=>{h=fix(h+off+.5/60,24);return String(Math.floor(h)).padStart(2,'0')+':'+String(Math.floor((h%1)*60)).padStart(2,'0')};
  return{fajr:f(fajr),sunrise:f(rise),dhuhr:f(noon),asr:f(asr),maghrib:f(set),isha:f(isha)};
}

const tm=x=>{const m=/^(\d{1,2})[:h](\d{2})/.exec((x||'').trim());return m?m[1].padStart(2,'0')+':'+m[2]:null};
function parseCSV(t,id){const out=[];t.split(/\r?\n/).forEach(l=>{const c=l.split(/[;,\t]/).map(x=>x.trim());let d=c[0],m;
  if(m=/^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(d))d=`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  else if(m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(d))d=`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`; else return;
  const w=c.slice(1).map(tm), r=c.length>=7?{fajr:w[0],sunrise:w[1],dhuhr:w[2],asr:w[3],maghrib:w[4],isha:w[5]}:{fajr:w[0],sunrise:null,dhuhr:w[1],asr:w[2],maghrib:w[3],isha:w[4]};
  if(r.fajr&&r.dhuhr&&r.asr&&r.maghrib&&r.isha)out.push({mosque_id:id,day:d,...r})});return out}
const stat=t=>{const e=$('#st');if(e)e.textContent=t};
async function push(rows){for(let i=0;i<rows.length;i+=400){stat(ta('saving').replace('{a}',Math.min(i+400,rows.length)).replace('{b}',rows.length));
  const r=await sb.from('prayer_calendar').upsert(rows.slice(i,i+400),{onConflict:'mosque_id,day'});if(r.error)return msg(r.error.message)}stat(ta('days').replace('{n}',rows.length))}
function yearDays(y){const a=[];for(let d=new Date(Date.UTC(y,0,1));d.getUTCFullYear()===y;d=new Date(+d+864e5))a.push([d.getUTCFullYear(),d.getUTCMonth()+1,d.getUTCDate(),d.toISOString().slice(0,10)]);return a}
let U=null;

let CLAIM=new URLSearchParams(location.search).get('claim');
async function init(){const {data}=await sb.auth.getSession();U=data.session?.user;U?(CLAIM?edit():list()):login();}

function login(){RE=login;
  app.innerHTML=LB()+`<h1>Attawqit</h1><p>${ta('title')}</p><label>${ta('email')}</label><input id="e" type="email"><label>${ta('pwd')}</label><input id="p" type="password"><button id="in">${ta('login')}</button><button id="up" class="alt">${ta('signup')}</button>`;
  $('#in').onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:v('e'),password:$('#p').value});error?msg(error.message):init()};
  $('#up').onclick=async()=>{const {data,error}=await sb.auth.signUp({email:v('e'),password:$('#p').value});
    if(error) return msg(error.message);
    data.session?init():msg(ta('created'))};
}

async function list(){RE=list;
  const {data,error}=await sb.from('mosque_users').select('mosques(id,name,city)').eq('user_id',U.id);
  if(error) return msg(error.message);
  const ms=data.map(r=>r.mosques).filter(Boolean);
  app.innerHTML=LB()+`<h1>${ta('mymosques')}</h1>${ms.map(m=>`<div class="card"><b>${esc(m.name)}</b><br>${esc(m.city)}<br><button data-id="${m.id}">${ta('manage')}</button></div>`).join('')||`<p>${ta('nomosque')}</p>`}<button id="new">${ta('addm')}</button><button id="out" class="alt">${ta('logout')}</button>`;
  document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>edit(b.dataset.id));
  $('#new').onclick=()=>edit(); $('#out').onclick=async()=>{await sb.auth.signOut();init()};
}

async function edit(id){RE=()=>edit(id);
  let m={country:'France'}, s={}, a=[], claimNote=false;
  if(!id&&CLAIM){const d=(await sb.from('mosque_directory').select('*').eq('osm_id',CLAIM).single()).data;
    if(d){let cn=d.country;try{cn=new Intl.DisplayNames(['fr'],{type:'region'}).of(d.country)}catch(e){}
      m={country:cn||'France',name:d.name,address:d.address,city:d.city,postal_code:d.postcode,lat:d.lat,lng:d.lng,phone:d.phone,website:d.website};claimNote=true}}
  if(id){
    m=(await sb.from('mosques').select('*').eq('id',id).single()).data;
    s=(await sb.from('mosque_settings').select('*').eq('mosque_id',id).single()).data||{};
    a=(await sb.from('announcements').select('*').eq('mosque_id',id).order('sort')).data||[];
  }
  const c=(s.fixed_minutes||{}).calc||{}, pre=ANG[s.calc_method??12]||ANG[12], fa0=c.fa??pre[0], ia0=c.ia===undefined?pre[1]:c.ia;
  const w=(s.iqama||{}).wait_min||{fajr:30,dhuhr:10,asr:10,maghrib:10,isha:10};
  const f=(i,l,val,t='text')=>`<label>${l}</label><input id="${i}" type="${t}" value="${esc(val)}">`;
  app.innerHTML=LB()+`<p><a href="#" id="back">${ta('back')}</a></p><h1>${esc(m.name)||ta('newm')}</h1>${claimNote?`<div class="card">${ta('claimNote')}</div>`:''}
  ${id?`<div class="card">${ta('tvscreen')} : <a href="/?m=${m.slug}#tv" target="_blank">/?m=${m.slug}#tv</a><br>${ta('mobilever')} : <a href="/?m=${m.slug}" target="_blank">/?m=${m.slug}</a></div>`:''}
  <h2>${ta('sheet')}</h2>
  ${f('n',ta('name'),m.name)}${f('ad',ta('address'),m.address)}
  <div class="g"><div>${f('ci',ta('city'),m.city)}</div><div>${f('pc',ta('postal'),m.postal_code)}</div></div>
  ${f('co',ta('country'),m.country)}
  <div class="g"><div>${f('la',ta('lat'),m.lat,'number')}</div><div>${f('lo',ta('lng'),m.lng,'number')}</div></div>
  <button class="alt" id="gps">${ta('gps')}</button><p style="color:var(--mute)">${ta('mapHint')}</p><div id="map"></div>
  ${f('as',ta('assoc'),m.association)}${f('ph',ta('phone'),m.phone,'tel')}${f('em',ta('email'),m.email,'email')}${f('web',ta('website'),m.website)}<label>${ta('otherInfo')}</label><input id="oi" maxlength="200" value="${esc(m.other_info)}">
  <h2>${ta('facTitle')}</h2><div>${FAC.map(([k,ic])=>`<label class="ck"><input type="checkbox" data-f="${k}" ${(m.facilities||{})[k]?'checked':''}> ${ic} ${esc(fl(k))}</label>`).join('')}</div>
  <h2>${ta('photosT')}</h2>${id?`<div id="ph"></div><label class="alt" style="display:inline-block;padding:11px 18px;border:1px solid var(--gold);border-radius:14px;color:var(--gold);cursor:pointer">${ta('addPhotos')}<input type="file" id="pf" accept="image/*" multiple style="display:none"></label><p style="color:var(--mute)">${ta('photoMax')}</p>`:`<p style="color:var(--mute)">${ta('savePhotoFirst')}</p>`}
  <h2>${ta('schedules')}</h2>
  <label>${ta('source')}</label>
  <select id="src">${[['auto',ta('src_auto')],['calendar',ta('src_cal')],['official',ta('src_off')],['diyanet','Diyanet İşleri Başkanlığı']].map(([k,n])=>`<option value="${k}" ${(s.calc_source==='api'||!s.calc_source?'auto':s.calc_source)===k?'selected':''}>${n}</option>`).join('')}</select>
  <div id="autoBox">
  <label>${ta('org')}</label><select id="me">${METHODS().map(([k,n])=>`<option value="${k}" ${(s.calc_method??12)==k?'selected':''}>${n}</option>`).join('')}</select>
  <div class="g"><div><label>${ta('fajrA')}</label><select id="fa">${ANGS.map(x=>`<option ${fa0==x?'selected':''}>${x}</option>`).join('')}</select></div>
  <div><label>${ta('ishaA')}</label><select id="ia"><option value="" ${ia0==null?'selected':''}>${ta('useMin')}</option>${ANGS.map(x=>`<option ${ia0==x?'selected':''}>${x}</option>`).join('')}</select></div></div>
  ${f('im',ta('ishaMin'),c.imin??(ia0==null?90:''),'number')}
  <label>${ta('asrCalc')}</label><select id="asr2"><option value="1" ${(c.asr||1)==1?'selected':''}>${ta('asr1')}</option><option value="2" ${c.asr==2?'selected':''}>Hanafi</option></select>
  <p style="color:var(--mute);font-size:.85rem">Plus l’angle est grand, plus le Fajr est tôt et l’Isha tardive. Le choix de l’organisme dépend de ta mosquée.</p></div>
  ${f('tz',ta('tz'),s.timezone||Intl.DateTimeFormat().resolvedOptions().timeZone)}
  <label>${ta('iqamaDelay')}</label>
  <div class="g">${P.map(p=>`<div>${f('w_'+p,PNAME(p),w[p],'number')}</div>`).join('')}<div>${f('ju',ta('jumuaT'),(s.jumua||{}).time||'13:00','time')}</div></div>
  <h2>${ta('display')}</h2>
  <label>${ta('screenLang')}</label><select id="dl">${[['fr','Français'],['en','English'],['ar','العربية'],['de','Deutsch'],['es','Español'],['pt','Português'],['tr','Türkçe']].map(([c,n])=>`<option value="${c}" ${((s.display||{}).lang||'fr')===c?'selected':''}>${n}</option>`).join('')}</select>
  <label>${ta('hfmt')}</label><select id="dh"><option value="24" ${(s.display||{}).h12?'':'selected'}>24 h</option><option value="12" ${(s.display||{}).h12?'selected':''}>12 h (AM/PM)</option></select>
  <button id="save">${ta('save')}</button>
  ${id?`<h2>${ta('calTitle')}</h2><p style="color:var(--mute)">Choisis le calcul automatique (par angle du soleil) ou importe ton propre fichier CSV. Les horaires sont enregistrés dans la base : l’écran les lit même sans internet.</p>
  <div id="csvBox"><label>${ta('csvLabel')}</label><input type="file" id="csv" accept=".csv,.txt">
  <button id="impcsv">${ta('csvImport')}</button><button class="alt" id="tpl">${ta('csvTpl')}</button></div><p id="st"></p>`:''}
  ${id?`<h2>${ta('annT')}</h2>${a.map(x=>`<div class="card">${esc(x.content)}<br><button class="alt" data-del="${x.id}">${ta('del')}</button></div>`).join('')}
  <label>${ta('newAnn')}</label><input id="an"><button id="adda">${ta('addAnn')}</button>`:''}`;
  $('#me').onchange=()=>{const p=ANG[+v('me')];if(p){$('#fa').value=p[0];$('#ia').value=p[1]??'';$('#im').value=p[1]==null?90:''}};
  const sync=()=>{const x=v('src');$('#autoBox').style.display=x==='calendar'?'none':'block';const cb=$('#csvBox');if(cb)cb.style.display=x==='calendar'?'block':'none';
    if(x==='diyanet'){$('#me').value=13;$('#me').onchange()}
    if(x==='official'){const k=OFF[v('co').toLowerCase()];if(k){$('#me').value=k;$('#me').onchange()}else msg(ta('officialNone'))}};
  $('#src').onchange=sync; {const x=v('src');$('#autoBox').style.display=x==='calendar'?'none':'block';const cb=$('#csvBox');if(cb)cb.style.display=x==='calendar'?'block':'none'}
  initMap();
  if(id){let ph=[...(m.photos||[])];const bk='mosque-photos';
    const draw=()=>{$('#ph').innerHTML=ph.map(u=>`<span class="thumb"><img src="${esc(u)}" alt=""><button class="alt" data-pd="${esc(u)}">✕</button></span>`).join('');
      document.querySelectorAll('[data-pd]').forEach(b=>b.onclick=async()=>{const u=b.dataset.pd;try{await sb.storage.from(bk).remove([u.split('/'+bk+'/')[1]])}catch(e){}
        ph=ph.filter(x=>x!==u);await sb.from('mosques').update({photos:ph}).eq('id',id);draw()})};
    draw();
    $('#pf').onchange=async e=>{for(const f of [...e.target.files]){if(ph.length>=6){msg(ta('photoMax'));break}
      try{const blob=await resizeImg(f,1280),path=id+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,7)+'.jpg',up=await sb.storage.from(bk).upload(path,blob,{contentType:'image/jpeg'});
        if(up.error)throw up.error;ph.push(sb.storage.from(bk).getPublicUrl(path).data.publicUrl)}catch(er){msg(ta('photoErr')+' '+((er&&er.message)||''))}}
      const r=await sb.from('mosques').update({photos:ph}).eq('id',id);if(r.error)msg(r.error.message);draw()}}
  $('#back').onclick=e=>{e.preventDefault();list()};
  $('#gps').onclick=()=>navigator.geolocation.getCurrentPosition(p=>{$('#la').value=p.coords.latitude;$('#lo').value=p.coords.longitude;window.MAPSYNC&&window.MAPSYNC()},()=>msg(ta('geoFail')));
  $('#save').onclick=async()=>{
    if(!v('n')||!v('co')||!v('la')||!v('lo')) return msg(ta('required'));
    const row={name:v('n'),address:v('ad'),city:v('ci'),postal_code:v('pc'),country:v('co'),lat:+v('la'),lng:+v('lo'),association:v('as'),phone:v('ph'),email:v('em'),website:v('web')||null,other_info:v('oi')||null,facilities:Object.fromEntries([...document.querySelectorAll('[data-f]')].map(c=>[c.dataset.f,!!c.checked])),updated_at:new Date().toISOString()};
    let mid=id;
    if(!mid){
      row.slug=slugify(v('n')+' '+v('ci'))||'mosquee-'+Date.now();
      const r=await sb.from('mosques').insert(row).select().single();
      if(r.error) return msg(r.error.message); mid=r.data.id;
      if(CLAIM){await sb.rpc('claim_directory',{p_osm:CLAIM,p_mosque:mid});CLAIM=null;try{history.replaceState(null,'',location.pathname)}catch(e){}}
    } else { const r=await sb.from('mosques').update(row).eq('id',mid); if(r.error) return msg(r.error.message); }
    const wait={}; P.forEach(p=>wait[p]=+v('w_'+p));
    const r2=await sb.from('mosque_settings').update({calc_source:v('src'),calc_method:+v('me'),timezone:v('tz'),display:{...(s.display||{}),lang:v('dl'),h12:v('dh')==='12'},fixed_minutes:{...(s.fixed_minutes||{}),calc:opts()},iqama:{...(s.iqama||{}),wait_min:wait},jumua:{...(s.jumua||{}),time:v('ju')||null}}).eq('mosque_id',mid);
    if(r2.error) return msg(r2.error.message);
    if(v('src')!=='calendar'){const y0=new Date().getFullYear(),rows=[],o=opts();
      try{[y0,y0+1,y0+2].forEach(y=>yearDays(y).forEach(([Y,M,D,iso])=>rows.push({mosque_id:mid,day:iso,...calcDay(Y,M,D,+v('la'),+v('lo'),v('tz'),+v('me'),o)})))}
      catch(e){return msg(ta('tzBad'))}
      await push(rows);}
    msg(ta('saved')+(v('src')!=='calendar'?ta('saved3'):'')); edit(mid);
  };
  if(id){
    $('#impcsv').onclick=async()=>{const fl=$('#csv').files[0];if(!fl)return msg(ta('csvPick'));
      const rows=parseCSV(await fl.text(),id);if(!rows.length)return msg(ta('csvBad'));await push(rows)};
    $('#tpl').onclick=()=>{const y=new Date().getFullYear(),L=['date;fajr;chourouk;dhuhr;asr;maghrib;isha'];
      try{yearDays(y).forEach(([Y,M,D,iso])=>{const c=calcDay(Y,M,D,+v('la'),+v('lo'),v('tz'),+v('me'),opts());L.push([iso,c.fajr,c.sunrise,c.dhuhr,c.asr,c.maghrib,c.isha].join(';'))})}catch(e){return msg(ta('tplNeed'))}
      const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([L.join('\n')],{type:'text/csv'}));a.download='horaires-'+y+'.csv';a.click()};
    $('#adda').onclick=async()=>{if(!v('an'))return;const r=await sb.from('announcements').insert({mosque_id:id,content:v('an'),kind:'text'});r.error?msg(r.error.message):edit(id)};
    document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{await sb.from('announcements').delete().eq('id',b.dataset.del);edit(id)});
  }
}
app.addEventListener('change',e=>{if(e.target.id==='ul'){AL=e.target.value;try{localStorage.setItem('admin_lang',AL)}catch(x){}RE()}});
init();
